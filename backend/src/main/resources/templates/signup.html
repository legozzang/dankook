<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Recruit - 회원가입</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{
      --bg:#f3f5f7; --card:#fff; --line:#d7dde4; --text:#1f2937; --muted:#667085;
      --primary:#1f6fb2; --primary-strong:#185f99; --radius:12px;
    }
    *{box-sizing:border-box} body{margin:0;font-family:"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px}
    h1{margin:0 0 20px;font-size:28px}
    .field{margin-bottom:14px} label{display:block;margin-bottom:7px;font-weight:700}
    input,select{width:100%;height:44px;border:1px solid #cfd6df;border-radius:10px;padding:0 12px;font-size:14px;background:#fff}
    select:disabled{background:#f5f6f8;color:#98a2b3}
    .btn{width:100%;height:46px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
    .btn:hover{background:var(--primary-strong)}
    .error{display:none;margin:10px 0 0;color:#b42318;font-size:13px}
    .hint{margin:0 0 8px;color:var(--muted);font-size:13px}
    .region-group{margin-top:10px}
    .region-group strong{display:block;margin-bottom:6px;font-size:13px}
    .region-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .sub{margin-top:14px;color:var(--muted);font-size:14px;text-align:center}
    .sub a{color:var(--primary);text-decoration:none;font-weight:700}
    @media(max-width:520px){.region-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>회원가입</h1>
      <form id="signupForm">
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" required />
        </div>
        <div class="field">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" required />
        </div>
        <div class="field">
          <label>관심 지역</label>
          <p class="hint">관심 지역 1은 필수이며, 관심 지역 2·3은 선택 입력입니다.</p>

          <div class="region-group">
            <strong>관심 지역 1 (내 거주지)</strong>
            <div class="region-row">
              <select id="region1Sido" required><option value="">시/도</option></select>
              <select id="region1Sigungu" required disabled><option value="">시/군/구</option></select>
            </div>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <input type="text" id="region1Detail" required placeholder="상세 주소 (예: 죽전로 152 / OO아파트 101동)" style="flex:1;" />
              <button type="button" id="pickFromMapBtn" style="width:110px;height:44px;border:1px solid var(--primary);border-radius:10px;background:#fff;color:var(--primary);font-weight:800;cursor:pointer;flex-shrink:0;">지도에서 선택</button>
            </div>
            <p class="hint" style="margin-top:6px;">시/도·시/군/구를 선택하고 상세 주소를 입력해주세요. 또는 <strong>지도에서 선택</strong>으로 위치를 찍어도 됩니다.</p>
            <p id="addressStatus" style="margin:6px 0 0;font-size:13px;font-weight:700;"></p>
            <p id="mapPickHint" style="display:none;font-size:12px;color:#667085;margin:6px 0 4px;">
              지도를 클릭하면 해당 위치의 주소가 자동으로 입력됩니다.
            </p>
            <div id="addressMap" style="display:none;height:200px;margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;"></div>
          </div>

          <div class="region-group">
            <strong>관심 지역 2 <span style="font-weight:400;color:var(--muted)">(선택)</span></strong>
            <div class="region-row">
              <select id="region2Sido"><option value="">시/도</option></select>
              <select id="region2Sigungu" disabled><option value="">시/군/구</option></select>
            </div>
          </div>

          <div class="region-group">
            <strong>관심 지역 3 <span style="font-weight:400;color:var(--muted)">(선택)</span></strong>
            <div class="region-row">
              <select id="region3Sido"><option value="">시/도</option></select>
              <select id="region3Sigungu" disabled><option value="">시/군/구</option></select>
            </div>
          </div>
        </div>
        <div class="field">
          <label>선호 직종 <span style="font-weight:400;color:var(--muted)">(선택)</span></label>
          <div class="region-row">
            <select id="prefJobMajor"><option value="">대분류</option></select>
            <select id="prefJobMid" disabled><option value="">중분류</option></select>
          </div>
        </div>
        <div class="field">
          <label>선호 급여 <span style="font-weight:400;color:var(--muted)">(선택)</span></label>
          <div class="region-row">
            <select id="prefPayType">
              <option value="">선택 안 함</option>
              <option value="시급">시급</option>
              <option value="일급">일급</option>
              <option value="월급">월급</option>
              <option value="연봉">연봉</option>
            </select>
            <input type="number" id="prefMinPay" placeholder="최소 희망 급여 (예: 2000000)" />
          </div>
        </div>
        <div id="errorMessage" class="error"></div>
        <button type="submit" class="btn">가입하기</button>
      </form>
      <p class="sub">이미 계정이 있으신가요? <a href="/auth/login">로그인</a></p>
    </section>
  </main>

  <script th:inline="javascript">
    const SIGUNGU_BY_SIDO_RAW = /*[[${sigunguBySidoJson}]]*/ '{}';
    const SIGUNGU_BY_SIDO = typeof SIGUNGU_BY_SIDO_RAW === 'string'
      ? JSON.parse(SIGUNGU_BY_SIDO_RAW || '{}')
      : (SIGUNGU_BY_SIDO_RAW || {});
    const KSCO_RAW = /*[[${kscoHierarchyJson}]]*/ '{}';
    const KSCO = typeof KSCO_RAW === 'string'
      ? JSON.parse(KSCO_RAW || '{}')
      : (KSCO_RAW || {});

    const SIDO_COORDS = {
      '서울특별시':[37.5665,126.9780],'부산광역시':[35.1796,129.0756],
      '대구광역시':[35.8714,128.6014],'인천광역시':[37.4563,126.7052],
      '광주광역시':[35.1595,126.8526],'대전광역시':[36.3504,127.3845],
      '울산광역시':[35.5384,129.3114],'세종특별자치시':[36.4801,127.2890],
      '경기도':[37.4138,127.5183],'강원도':[37.8228,128.1555],
      '충청북도':[36.6358,127.4914],'충청남도':[36.6588,126.6728],
      '전라북도':[35.7175,127.1530],'전라남도':[34.8679,126.9910],
      '경상북도':[36.4919,128.8889],'경상남도':[35.4606,128.2132],
      '제주특별자치도':[33.4890,126.4983]
    };

    // ── 주소 확인(지오코딩 미리보기) 상태 ─────────────────────────────
    let addressVerified = false;   // 주소 확인 통과 여부
    let verifiedAddress = '';      // 확인을 통과한 상세주소 문자열
    let previewMap = null;
    let previewMarker = null;
    let mapClickEnabled = false;

    document.addEventListener('DOMContentLoaded', () => {
      [1, 2, 3].forEach(setupRegionCascade);
      setupAddressVerification();
      setupJobCascade();
    });

    function setAddressStatus(text, color) {
      const el = document.getElementById('addressStatus');
      el.textContent = text;
      el.style.color = color;
    }

    function invalidateAddress() {
      addressVerified = false;
      verifiedAddress = '';
      setAddressStatus('', '');
    }

    function showPreviewMap(lat, lng) {
      const mapEl = document.getElementById('addressMap');
      mapEl.style.display = 'block';
      if (!previewMap) {
        previewMap = L.map(mapEl).setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '&copy; OpenStreetMap'
        }).addTo(previewMap);
      } else {
        previewMap.setView([lat, lng], 16);
      }
      if (previewMarker) previewMarker.remove();
      previewMarker = L.marker([lat, lng]).addTo(previewMap);
      setTimeout(() => previewMap.invalidateSize(), 100); // 숨김→표시 직후 렌더 보정
    }

    function updateMapZoom() {
      if (!previewMap) return;
      const _sidoVal = document.getElementById('region1Sido').value;
      const _sigunguVal = document.getElementById('region1Sigungu').value;
      const _detailVal = document.getElementById('region1Detail').value.trim();
      if (_detailVal) {
        (async () => {
          try {
            const r = await fetch('/auth/geocode/preview', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sido: _sidoVal, sigungu: _sigunguVal, detail: _detailVal })
            });
            if (r.ok) { const c = await r.json(); previewMap.setView([c.latitude, c.longitude], 16); }
          } catch(e) {}
        })();
      } else if (_sigunguVal) {
        (async () => {
          try {
            const r = await fetch('/auth/geocode/preview', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sido: '', sigungu: '', detail: _sidoVal + ' ' + _sigunguVal })
            });
            if (r.ok) { const c = await r.json(); previewMap.setView([c.latitude, c.longitude], 13); }
          } catch(e) {}
        })();
      } else if (_sidoVal && SIDO_COORDS[_sidoVal]) {
        previewMap.setView(SIDO_COORDS[_sidoVal], 9);
      } else if (previewMarker) {
        previewMap.setView(previewMarker.getLatLng(), 16);
      }
    }

    function setupAddressVerification() {
      const detailInput = document.getElementById('region1Detail');
      const pickFromMapBtn = document.getElementById('pickFromMapBtn');
      const mapPickHint = document.getElementById('mapPickHint');
      const mapEl = document.getElementById('addressMap');

      // 주소·지역이 바뀌면 재확인 필요
      detailInput.addEventListener('input', invalidateAddress);
      document.getElementById('region1Sido').addEventListener('change', () => {
        invalidateAddress();
        detailInput.value = '';
        if (document.getElementById('addressMap').style.display !== 'none') updateMapZoom();
      });
      document.getElementById('region1Sigungu').addEventListener('change', () => {
        invalidateAddress();
        detailInput.value = '';
        if (document.getElementById('addressMap').style.display !== 'none') updateMapZoom();
      });

      pickFromMapBtn.addEventListener('click', () => {
        mapEl.style.display = 'block';
        mapPickHint.style.display = 'block';

        if (typeof L === 'undefined') {
          setAddressStatus('지도 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.', '#b42318');
          mapEl.style.display = 'none';
          mapPickHint.style.display = 'none';
          return;
        }

        if (!previewMap) {
          previewMap = L.map(mapEl).setView([36.5, 127.5], 7);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '&copy; OpenStreetMap'
          }).addTo(previewMap);
        }

        updateMapZoom();

        mapEl.style.cursor = 'crosshair';
        setTimeout(() => previewMap.invalidateSize(), 100);

        if (mapClickEnabled) {
          return;
        }
        mapClickEnabled = true;

        previewMap.on('click', async (e) => {
          const { lat, lng } = e.latlng;
          if (previewMarker) {
            previewMarker.setLatLng([lat, lng]);
          } else {
            previewMarker = L.marker([lat, lng]).addTo(previewMap);
          }

          setAddressStatus('주소 조회 중...', '#667085');
          try {
            const res = await fetch(`/auth/geocode/reverse?lat=${lat}&lng=${lng}`);
            if (!res.ok) {
              setAddressStatus('해당 위치의 주소를 찾을 수 없습니다.', '#b42318');
              return;
            }

            const data = await res.json();
            const sido = document.getElementById('region1Sido');
            const sigungu = document.getElementById('region1Sigungu');
            const detail = document.getElementById('region1Detail');
            const detailAddress = data.detail_address || data.detailAddress || '';

            const sidoVal = findSelectValue(sido, data.sido || '');
            sido.value = sidoVal;
            fillSelect(sigungu, SIGUNGU_BY_SIDO[sidoVal] || [], '시/군/구');
            sigungu.value = findSelectValue(sigungu, data.sigungu || '');
            detail.value = detailAddress;

            addressVerified = true;
            verifiedAddress = detailAddress;
            mapEl.style.display = 'block';
            mapPickHint.style.display = 'block';
            setTimeout(() => previewMap.invalidateSize(), 100);
            setAddressStatus('✓ 지도에서 위치가 선택되었습니다.', '#1f6fb2');
          } catch (e) {
            setAddressStatus('주소 조회 중 오류가 발생했습니다.', '#b42318');
          }
        });
      });
    }

    function resetSelect(select, placeholder) {
      select.innerHTML = `<option value="">${placeholder}</option>`;
      select.disabled = true;
    }

    function fillSelect(select, values, placeholder) {
      select.innerHTML = `<option value="">${placeholder}</option>`;
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      select.disabled = values.length === 0;
    }

    function findSelectValue(select, value) {
      if (!value) return '';
      for (const opt of select.options) {
        if (opt.value === value) return value;
      }
      const norm = {
        '서울':'서울특별시','부산':'부산광역시','대구':'대구광역시',
        '인천':'인천광역시','광주':'광주광역시','대전':'대전광역시',
        '울산':'울산광역시','세종':'세종특별자치시','경기':'경기도',
        '강원':'강원도','충북':'충청북도','충남':'충청남도',
        '전북':'전라북도','전남':'전라남도','경북':'경상북도',
        '경남':'경상남도','제주':'제주특별자치도'
      };
      const denorm = Object.fromEntries(Object.entries(norm).map(([key, mapped]) => [mapped, key]));
      for (const alt of [norm[value], denorm[value]].filter(Boolean)) {
        for (const opt of select.options) {
          if (opt.value === alt) return alt;
        }
      }
      for (const opt of select.options) {
        if (opt.value && opt.value.startsWith(value)) return opt.value;
      }
      return '';
    }

    function setupRegionCascade(rank) {
      const sido = document.getElementById(`region${rank}Sido`);
      const sigungu = document.getElementById(`region${rank}Sigungu`);

      const sidoFallback = [
        '서울특별시','부산광역시','대구광역시','인천광역시','광주광역시',
        '대전광역시','울산광역시','세종특별자치시','경기도','강원도',
        '충청북도','충청남도','전라북도','전라남도','경상북도','경상남도',
        '제주특별자치도'
      ];
      const sidoOptions = Object.keys(SIGUNGU_BY_SIDO).length > 0
        ? Object.keys(SIGUNGU_BY_SIDO)
        : sidoFallback;

      fillSelect(sido, sidoOptions, '시/도');
      sido.disabled = false;

      sido.addEventListener('change', () => {
        fillSelect(sigungu, SIGUNGU_BY_SIDO[sido.value] || [], '시/군/구');
      });
    }

    function setupJobCascade() {
      const major = document.getElementById('prefJobMajor');
      const mid = document.getElementById('prefJobMid');
      fillSelect(major, Object.keys(KSCO), '대분류');
      major.disabled = false;
      major.addEventListener('change', () => {
        resetSelect(mid, '중분류');
        if (major.value) {
          fillSelect(mid, Object.keys(KSCO[major.value] || {}), '중분류');
        }
      });
    }

    function readRegion(rank) {
      return {
        sido: document.getElementById(`region${rank}Sido`).value,
        sigungu: document.getElementById(`region${rank}Sigungu`).value
      };
    }

    function validateRegions(regions) {
      const primaryRegion = regions[0];
      if (!primaryRegion.sido || !primaryRegion.sigungu) {
        return '관심 지역 1은 시/도와 시/군/구를 모두 선택해주세요.';
      }

      const incompleteOptionalRegion = regions.slice(1).some(region => {
        return (region.sido && !region.sigungu) || (!region.sido && region.sigungu);
      });
      if (incompleteOptionalRegion) {
        return '관심 지역 2·3은 입력하려면 시/도와 시/군/구를 모두 선택해주세요.';
      }

      const keys = regions
        .filter(region => region.sido && region.sigungu)
        .map(region => `${region.sido} ${region.sigungu}`);
      if (new Set(keys).size !== keys.length) {
        return '입력한 관심 지역은 서로 다르게 선택해주세요.';
      }

      return '';
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.style.display = 'none';

      const regions = [readRegion(1), readRegion(2), readRegion(3)];
      const regionError = validateRegions(regions);
      if (regionError) {
        errorDiv.textContent = regionError;
        errorDiv.style.display = 'block';
        return;
      }

      const homeAddress = document.getElementById('region1Detail').value.trim();
      if (!homeAddress) {
        errorDiv.textContent = '관심 지역 1의 상세 주소를 입력해주세요.';
        errorDiv.style.display = 'block';
        return;
      }

      const submitBtn = document.querySelector('#signupForm button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = '주소 확인 중...';
      try {
        const geoRes = await fetch('/auth/geocode/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sido: regions[0].sido,
            sigungu: regions[0].sigungu,
            detail: homeAddress
          })
        });
        if (!geoRes.ok) {
          errorDiv.textContent = (await geoRes.text()) || '입력하신 주소의 위치를 찾을 수 없습니다. 상세 주소를 다시 확인해주세요.';
          errorDiv.style.display = 'block';
          return;
        }
        addressVerified = true;
        verifiedAddress = homeAddress;
      } catch (e) {
        errorDiv.textContent = '주소 확인 중 오류가 발생했습니다.';
        errorDiv.style.display = 'block';
        return;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '가입하기';
      }

      const prefMinPayVal = document.getElementById('prefMinPay').value;
      const signupData = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        nickname: document.getElementById('nickname').value,
        role: 'SEEKER',
        desired_region_sido: regions[0].sido,
        desired_region_sigungu: regions[0].sigungu,
        home_address: homeAddress,
        desired_region2_sido: regions[1].sido || null,
        desired_region2_sigungu: regions[1].sigungu || null,
        desired_region3_sido: regions[2].sido || null,
        desired_region3_sigungu: regions[2].sigungu || null,
        preferred_job_type_major: document.getElementById('prefJobMajor').value || null,
        preferred_job_type_mid: document.getElementById('prefJobMid').value || null,
        preferred_pay_type: document.getElementById('prefPayType').value || null,
        min_pay_amount: prefMinPayVal ? parseInt(prefMinPayVal, 10) : null
      };

      try {
        const response = await fetch('/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(signupData)
        });

        if (response.ok) {
          const loginRes = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: signupData.email,
              password: signupData.password
            })
          }).catch(() => null);

          if (loginRes && loginRes.ok) {
            const data = await loginRes.json();
            localStorage.setItem('accessToken', data.access_token);
            localStorage.setItem('memberId', data.member_id);
            document.cookie = `accessToken=${data.access_token}; path=/; SameSite=Strict`;
            window.location.href = '/jobpostings';
          } else {
            alert('회원가입이 완료되었습니다. 로그인 페이지로 이동합니다.');
            window.location.href = '/auth/login';
          }
        } else {
          errorDiv.textContent = await response.text();
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = '서버와 통신 중 오류가 발생했습니다.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
