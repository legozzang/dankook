<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Recruit - 회원가입</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{
      --bg:#f3f5f7; --card:#fff; --line:#d7dde4; --text:#1f2937; --muted:#667085;
      --primary:#1f6fb2; --primary-strong:#185f99; --radius:12px;
    }
    *{box-sizing:border-box} body{margin:0;font-family:"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:100%;max-width:560px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px}
    h1{margin:0 0 20px;font-size:28px}
    .field{margin-bottom:14px} label{display:block;margin-bottom:7px;font-weight:700}
    input,select{width:100%;height:44px;border:1px solid #cfd6df;border-radius:10px;padding:0 12px;font-size:14px;background:#fff}
    select:disabled{background:#f5f6f8;color:#98a2b3}
    .btn{width:100%;height:46px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
    .btn:hover{background:var(--primary-strong)}
    .error{display:none;margin:10px 0 0;color:#b42318;font-size:13px}
    .hint{margin:0 0 8px;color:var(--muted);font-size:13px}
    .region-group{margin-top:10px}
    .region-group strong{display:block;margin-bottom:6px;font-size:13px}
    .region-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .sub{margin-top:14px;color:var(--muted);font-size:14px;text-align:center}
    .sub a{color:var(--primary);text-decoration:none;font-weight:700}
    @media(max-width:520px){.region-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>회원가입</h1>
      <form id="signupForm">
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" required />
        </div>
        <div class="field">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" required />
        </div>
        <div class="field">
          <label>관심 지역</label>
          <p class="hint">관심 지역 1은 필수이며, 관심 지역 2·3은 선택 입력입니다.</p>

          <div class="region-group">
            <strong>관심 지역 1 (내 거주지)</strong>
            <div class="region-row">
              <select id="region1Sido" required><option value="">시/도</option></select>
              <select id="region1Sigungu" required disabled><option value="">시/군/구</option></select>
            </div>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <input type="text" id="region1Detail" required placeholder="상세 주소 (예: 죽전로 152 / OO아파트 101동)" style="flex:1;" />
              <button type="button" id="verifyAddressBtn" style="width:96px;height:44px;border:1px solid var(--primary);border-radius:10px;background:#eaf3fb;color:var(--primary);font-weight:800;cursor:pointer;flex-shrink:0;">주소 확인</button>
            </div>
            <p class="hint" style="margin-top:6px;">시/도·시/군/구 선택 후 상세 주소를 입력하고 <strong>주소 확인</strong>을 눌러 위치를 확정해주세요.</p>
            <p id="addressStatus" style="margin:6px 0 0;font-size:13px;font-weight:700;"></p>
            <div id="addressMap" style="display:none;height:200px;margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;"></div>
          </div>

          <div class="region-group">
            <strong>관심 지역 2</strong>
            <div class="region-row">
              <select id="region2Sido"><option value="">시/도</option></select>
              <select id="region2Sigungu" disabled><option value="">시/군/구</option></select>
            </div>
          </div>

          <div class="region-group">
            <strong>관심 지역 3</strong>
            <div class="region-row">
              <select id="region3Sido"><option value="">시/도</option></select>
              <select id="region3Sigungu" disabled><option value="">시/군/구</option></select>
            </div>
          </div>
        </div>
        <div id="errorMessage" class="error"></div>
        <button type="submit" class="btn">가입하기</button>
      </form>
      <p class="sub">이미 계정이 있으신가요? <a href="/auth/login">로그인</a></p>
    </section>
  </main>

  <script th:inline="javascript">
    const SIGUNGU_BY_SIDO = JSON.parse(/*[[${sigunguBySidoJson}]]*/ '{}');

    // ── 주소 확인(지오코딩 미리보기) 상태 ─────────────────────────────
    let addressVerified = false;   // 주소 확인 통과 여부
    let verifiedAddress = '';      // 확인을 통과한 상세주소 문자열
    let previewMap = null;
    let previewMarker = null;

    document.addEventListener('DOMContentLoaded', () => {
      [1, 2, 3].forEach(setupRegionCascade);
      setupAddressVerification();
    });

    function setAddressStatus(text, color) {
      const el = document.getElementById('addressStatus');
      el.textContent = text;
      el.style.color = color;
    }

    function invalidateAddress() {
      addressVerified = false;
      verifiedAddress = '';
      setAddressStatus('', '');
      document.getElementById('addressMap').style.display = 'none';
    }

    function showPreviewMap(lat, lng) {
      const mapEl = document.getElementById('addressMap');
      mapEl.style.display = 'block';
      if (!previewMap) {
        previewMap = L.map(mapEl).setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19, attribution: '&copy; OpenStreetMap'
        }).addTo(previewMap);
      } else {
        previewMap.setView([lat, lng], 16);
      }
      if (previewMarker) previewMarker.remove();
      previewMarker = L.marker([lat, lng]).addTo(previewMap);
      setTimeout(() => previewMap.invalidateSize(), 100); // 숨김→표시 직후 렌더 보정
    }

    function setupAddressVerification() {
      const detailInput = document.getElementById('region1Detail');
      const verifyBtn = document.getElementById('verifyAddressBtn');

      // 주소·지역이 바뀌면 재확인 필요
      detailInput.addEventListener('input', invalidateAddress);
      document.getElementById('region1Sido').addEventListener('change', invalidateAddress);
      document.getElementById('region1Sigungu').addEventListener('change', invalidateAddress);

      verifyBtn.addEventListener('click', async () => {
        const sido = document.getElementById('region1Sido').value;
        const sigungu = document.getElementById('region1Sigungu').value;
        const detail = detailInput.value.trim();

        if (!sido || !sigungu) {
          setAddressStatus('먼저 관심 지역 1의 시/도·시/군/구를 선택해주세요.', '#b42318');
          return;
        }
        if (detail.length < 5) {
          setAddressStatus('상세 주소를 더 구체적으로 입력해주세요. (예: 죽전로 152)', '#b42318');
          return;
        }

        setAddressStatus('위치 확인 중...', '#667085');
        verifyBtn.disabled = true;
        try {
          const res = await fetch('/auth/geocode/preview', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sido, sigungu, detail })
          });
          if (res.ok) {
            const coord = await res.json();
            addressVerified = true;
            verifiedAddress = detail;
            setAddressStatus('✓ 위치가 확인되었습니다. 지도를 확인해주세요.', '#1f6fb2');
            showPreviewMap(coord.latitude, coord.longitude);
          } else {
            invalidateAddress();
            setAddressStatus(await res.text() || '위치를 찾을 수 없습니다. 주소를 다시 확인해주세요.', '#b42318');
          }
        } catch (e) {
          invalidateAddress();
          setAddressStatus('서버와 통신 중 오류가 발생했습니다.', '#b42318');
        } finally {
          verifyBtn.disabled = false;
        }
      });
    }

    function resetSelect(select, placeholder) {
      select.innerHTML = `<option value="">${placeholder}</option>`;
      select.disabled = true;
    }

    function fillSelect(select, values, placeholder) {
      select.innerHTML = `<option value="">${placeholder}</option>`;
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      select.disabled = values.length === 0;
    }

    function setupRegionCascade(rank) {
      const sido = document.getElementById(`region${rank}Sido`);
      const sigungu = document.getElementById(`region${rank}Sigungu`);

      fillSelect(sido, Object.keys(SIGUNGU_BY_SIDO), '시/도');
      sido.disabled = false;

      sido.addEventListener('change', () => {
        fillSelect(sigungu, SIGUNGU_BY_SIDO[sido.value] || [], '시/군/구');
      });
    }

    function readRegion(rank) {
      return {
        sido: document.getElementById(`region${rank}Sido`).value,
        sigungu: document.getElementById(`region${rank}Sigungu`).value
      };
    }

    function validateRegions(regions) {
      const primaryRegion = regions[0];
      if (!primaryRegion.sido || !primaryRegion.sigungu) {
        return '관심 지역 1은 시/도와 시/군/구를 모두 선택해주세요.';
      }

      const incompleteOptionalRegion = regions.slice(1).some(region => {
        return (region.sido && !region.sigungu) || (!region.sido && region.sigungu);
      });
      if (incompleteOptionalRegion) {
        return '관심 지역 2·3은 입력하려면 시/도와 시/군/구를 모두 선택해주세요.';
      }

      const keys = regions
        .filter(region => region.sido && region.sigungu)
        .map(region => `${region.sido} ${region.sigungu}`);
      if (new Set(keys).size !== keys.length) {
        return '입력한 관심 지역은 서로 다르게 선택해주세요.';
      }

      return '';
    }

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.style.display = 'none';

      const regions = [readRegion(1), readRegion(2), readRegion(3)];
      const regionError = validateRegions(regions);
      if (regionError) {
        errorDiv.textContent = regionError;
        errorDiv.style.display = 'block';
        return;
      }

      const homeAddress = document.getElementById('region1Detail').value.trim();
      if (!homeAddress) {
        errorDiv.textContent = '관심 지역 1의 상세 주소를 입력해주세요.';
        errorDiv.style.display = 'block';
        return;
      }
      if (!addressVerified || verifiedAddress !== homeAddress) {
        errorDiv.textContent = '상세 주소 옆 [주소 확인] 버튼을 눌러 위치를 확정해주세요.';
        errorDiv.style.display = 'block';
        return;
      }

      const signupData = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        nickname: document.getElementById('nickname').value,
        role: 'SEEKER',
        desired_region_sido: regions[0].sido,
        desired_region_sigungu: regions[0].sigungu,
        home_address: homeAddress,
        desired_region2_sido: regions[1].sido || null,
        desired_region2_sigungu: regions[1].sigungu || null,
        desired_region3_sido: regions[2].sido || null,
        desired_region3_sigungu: regions[2].sigungu || null
      };

      try {
        const response = await fetch('/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(signupData)
        });

        if (response.ok) {
          const loginRes = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: signupData.email,
              password: signupData.password
            })
          }).catch(() => null);

          if (loginRes && loginRes.ok) {
            const data = await loginRes.json();
            localStorage.setItem('accessToken', data.access_token);
            localStorage.setItem('memberId', data.member_id);
            document.cookie = `accessToken=${data.access_token}; path=/; SameSite=Strict`;
            window.location.href = '/jobpostings';
          } else {
            alert('회원가입이 완료되었습니다. 로그인 페이지로 이동합니다.');
            window.location.href = '/auth/login';
          }
        } else {
          errorDiv.textContent = await response.text();
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        errorDiv.textContent = '서버와 통신 중 오류가 발생했습니다.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
