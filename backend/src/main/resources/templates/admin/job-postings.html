<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공고 관리 | Smart Recruit</title>
    <style>
        body { margin: 0; background: #f6f7f9; color: #1f2937; font-family: Arial, "Noto Sans KR", sans-serif; }
        .page { max-width: 1320px; margin: 0 auto; padding: 32px 20px; }
        nav, form, .pagination { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; align-items: center; }
        nav a, button, .reset, .pagination a { padding: 9px 13px; border: 1px solid #cfd6df; border-radius: 6px; background: #fff; color: #1f2937; text-decoration: none; font-weight: 700; cursor: pointer; }
        nav a.active { border-color: #1769aa; color: #1769aa; background: #eaf3fb; }
        button.primary { border-color: #1769aa; background: #1769aa; color: #fff; }
        button.danger { border-color: #c2410c; background: #c2410c; color: #fff; }
        input, select { min-height: 36px; border: 1px solid #cfd6df; border-radius: 6px; padding: 0 10px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #dbe2ea; }
        th, td { padding: 11px 12px; border-bottom: 1px solid #e7ebf0; text-align: left; font-size: 14px; }
        th { background: #eef2f6; color: #4b5563; }
        h1 { margin: 0; }
        .pagination span { font-weight: 700; color: #4b5563; }
        .site-header { background: #fff; border-bottom: 1px solid #dde3ea; }
        .site-header__inner { max-width: 1180px; margin: 0 auto; min-height: 64px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .brand { display: inline-flex; align-items: center; gap: 10px; color: #172033; font-weight: 800; text-decoration: none; }
        .brand-mark { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; border-radius: 6px; background: #1769aa; color: #fff; font-size: 14px; }
        .brand-text { font-size: 16px; }
        .site-nav { display: flex; align-items: center; gap: 6px; }
        .site-nav__link { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 6px; border: none; color: #52606d; font-size: 14px; font-weight: 800; text-decoration: none; white-space: nowrap; background: transparent; }
        .site-nav__link:hover { background: #f1f5f9; color: #1769aa; }
        .site-nav__link.active { background: #e8f1fa; color: #1769aa; }
        .auth-actions { display: flex; align-items: center; gap: 8px; }
        .write-button { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 0 14px; border-radius: 6px; border: none; background: #1769aa; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
        .write-button--ghost { border: 1px solid #cfd6df; background: #fff; color: #1769aa; }
    </style>
    <script src="/js/auth-utils.js"></script>
</head>
<body>
<header class="site-header">
    <div class="site-header__inner">
        <a class="brand" href="/jobpostings">
            <span class="brand-mark">SR</span>
            <span class="brand-text">Smart Recruit</span>
        </a>
        <nav class="site-nav">
            <a class="site-nav__link" href="/jobpostings">채용 공고</a>
            <a class="site-nav__link" href="/communities">커뮤니티</a>
            <a class="site-nav__link" href="/dashboard">대시보드</a>
            <a class="site-nav__link active" href="/admin/dashboard">관리자</a>
        </nav>
        <div class="auth-actions">
            <div id="guestMenu"><a class="write-button" href="/auth/login">로그인</a></div>
            <div id="userMenu" style="display:none;gap:8px;">
                <a class="write-button write-button--ghost" href="/auth/mypage">내 정보</a>
                <button class="write-button" type="button" onclick="handleLogout()">로그아웃</button>
            </div>
        </div>
    </div>
</header>
<main class="page">
    <h1>공고 관리</h1>
    <nav>
        <a href="/admin">대시보드</a>
        <a href="/admin/members">유저 관리</a>
        <a class="active" href="/admin/job-postings">공고 관리</a>
    </nav>

    <form method="get" action="/admin/job-postings">
        <select name="status">
            <option value="">전체 상태</option>
            <option th:each="status : ${statuses}" th:value="${status.name()}" th:text="${status.name()}" th:selected="${currentFilters.status == status.name()}">OPEN</option>
        </select>
        <select name="regionSido" id="jpSido" onchange="updateSigungu('jpSido', 'jpSigungu')">
            <option value="">전체 지역</option>
            <option th:each="sido : ${sidoList}" th:value="${sido}" th:text="${sido}" th:selected="${sido == currentFilters.regionSido}">서울</option>
        </select>
        <select name="regionSigungu" id="jpSigungu">
            <option value="">전체 시군구</option>
        </select>
        <select name="jobTypeMajor" id="jpMajor" onchange="updateMid('jpMajor', 'jpMid')">
            <option value="">전체 직종</option>
            <option th:each="major : ${majorList}" th:value="${major}" th:text="${major}" th:selected="${major == currentFilters.jobTypeMajor}">음식서비스</option>
        </select>
        <select name="jobTypeMid" id="jpMid">
            <option value="">전체 중분류</option>
        </select>
        <input type="text" name="company" placeholder="회사명" th:value="${currentFilters.company}">
        <input type="text" name="keyword" placeholder="제목 키워드" th:value="${currentFilters.keyword}">
        <button class="primary" type="submit">검색</button>
        <a class="reset" href="/admin/job-postings">초기화</a>
    </form>

    <div class="pagination">
        <span th:text="|총 ${totalElements}건 · ${totalPages == 0 ? 0 : currentPage + 1}/${totalPages}페이지|">총 0건 · 0/0페이지</span>
        <a th:if="${currentPage > 0}"
           th:href="@{/admin/job-postings(page=${currentPage - 1},status=${currentFilters.status},regionSido=${currentFilters.regionSido},regionSigungu=${currentFilters.regionSigungu},jobTypeMajor=${currentFilters.jobTypeMajor},jobTypeMid=${currentFilters.jobTypeMid},company=${currentFilters.company},keyword=${currentFilters.keyword})}">이전</a>
        <a th:if="${currentPage + 1 < totalPages}"
           th:href="@{/admin/job-postings(page=${currentPage + 1},status=${currentFilters.status},regionSido=${currentFilters.regionSido},regionSigungu=${currentFilters.regionSigungu},jobTypeMajor=${currentFilters.jobTypeMajor},jobTypeMid=${currentFilters.jobTypeMid},company=${currentFilters.company},keyword=${currentFilters.keyword})}">다음</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>번호</th>
            <th>제목</th>
            <th>회사</th>
            <th>지역</th>
            <th>직종(세분류)</th>
            <th>급여유형</th>
            <th>상태</th>
            <th>등록일</th>
            <th>상태변경</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="jobPosting : ${jobPostings}" th:id="|job-${jobPosting.id}|">
            <td th:text="${jobPosting.id}">1</td>
            <td th:text="${jobPosting.title}">제목</td>
            <td th:text="${jobPosting.company}">회사</td>
            <td th:text="${jobPosting.regionSido + ' ' + jobPosting.regionSigungu}">서울 강남구</td>
            <td th:text="${jobPosting.jobTypeDetail}">세분류</td>
            <td th:text="${jobPosting.payType}">월급</td>
            <td th:text="${jobPosting.status.name()}">OPEN</td>
            <td th:text="${jobPosting.createdAt}">2026-01-01</td>
            <td>
                <button type="button"
                        th:data-next-status="${jobPosting.status.name() == 'OPEN' ? 'CLOSED' : 'OPEN'}"
                        th:text="${jobPosting.status.name() == 'OPEN' ? 'CLOSED로 변경' : 'OPEN으로 변경'}"
                        th:onclick="|changeStatus(${jobPosting.id}, this.dataset.nextStatus)|">상태변경</button>
            </td>
            <td><button class="danger" type="button" th:onclick="|deleteJob(${jobPosting.id})|">삭제</button></td>
        </tr>
        </tbody>
    </table>

    <div class="pagination">
        <span th:text="|총 ${totalElements}건 · ${totalPages == 0 ? 0 : currentPage + 1}/${totalPages}페이지|">총 0건 · 0/0페이지</span>
        <a th:if="${currentPage > 0}"
           th:href="@{/admin/job-postings(page=${currentPage - 1},status=${currentFilters.status},regionSido=${currentFilters.regionSido},regionSigungu=${currentFilters.regionSigungu},jobTypeMajor=${currentFilters.jobTypeMajor},jobTypeMid=${currentFilters.jobTypeMid},company=${currentFilters.company},keyword=${currentFilters.keyword})}">이전</a>
        <a th:if="${currentPage + 1 < totalPages}"
           th:href="@{/admin/job-postings(page=${currentPage + 1},status=${currentFilters.status},regionSido=${currentFilters.regionSido},regionSigungu=${currentFilters.regionSigungu},jobTypeMajor=${currentFilters.jobTypeMajor},jobTypeMid=${currentFilters.jobTypeMid},company=${currentFilters.company},keyword=${currentFilters.keyword})}">다음</a>
    </div>
</main>
<script th:inline="javascript">
    const SIGUNGU_BY_SIDO = JSON.parse(/*[[${sigunguBySidoJson}]]*/ '{}');
    const MID_BY_MAJOR = JSON.parse(/*[[${midByMajorJson}]]*/ '{}');
    const SEL_SIGUNGU = /*[[${currentFilters.regionSigungu}]]*/ '';
    const SEL_MID = /*[[${currentFilters.jobTypeMid}]]*/ '';

    function fillSelect(select, items, current) {
        items.forEach((value) => select.add(new Option(value, value, value === current, value === current)));
    }

    function updateSigungu(sidoId, sigunguId) {
        const select = document.getElementById(sigunguId);
        select.innerHTML = '<option value="">전체 시군구</option>';
        fillSelect(select, SIGUNGU_BY_SIDO[document.getElementById(sidoId).value] || [], SEL_SIGUNGU);
    }

    function updateMid(majorId, midId) {
        const select = document.getElementById(midId);
        select.innerHTML = '<option value="">전체 중분류</option>';
        fillSelect(select, MID_BY_MAJOR[document.getElementById(majorId).value] || [], SEL_MID);
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateSigungu('jpSido', 'jpSigungu');
        updateMid('jpMajor', 'jpMid');
        updateAuthNav();
    });

    // authHeaders() → auth-utils.js 에서 전역 제공

    async function handleLogout() {
        localStorage.removeItem("accessToken");
        localStorage.removeItem("memberId");
        await fetch("/auth/logout", { method: "POST" });
        location.reload();
    }

    function updateAuthNav() {
        const token = getToken();
        document.getElementById("guestMenu").style.display = token ? "none" : "";
        document.getElementById("userMenu").style.display = token ? "flex" : "none";
    }

    async function changeStatus(id, status) {
        const response = await fetch(`/admin/job-postings/${id}/status`, {
            method: 'PATCH',
            headers: authHeaders(),
            body: JSON.stringify({status})
        });
        if (response.ok) location.reload();
        else alert('상태 변경 실패');
    }

    async function deleteJob(id) {
        if (!confirm('삭제하시겠습니까?')) return;
        const response = await fetch(`/admin/job-postings/${id}`, {
            method: 'DELETE',
            headers: authHeaders()
        });
        if (response.ok) document.getElementById(`job-${id}`).remove();
        else alert('삭제 실패');
    }
</script>
</body>
</html>
