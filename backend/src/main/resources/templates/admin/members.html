<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>유저 관리 | Smart Recruit</title>
    <style>
        body { margin: 0; background: #f6f7f9; color: #1f2937; font-family: Arial, "Noto Sans KR", sans-serif; }
        .page { max-width: 1180px; margin: 0 auto; padding: 32px 20px; }
        nav, form { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0; align-items: center; }
        nav a, button, .reset { padding: 9px 13px; border: 1px solid #cfd6df; border-radius: 6px; background: #fff; color: #1f2937; text-decoration: none; font-weight: 700; cursor: pointer; }
        nav a.active { border-color: #1769aa; color: #1769aa; background: #eaf3fb; }
        button.primary { border-color: #1769aa; background: #1769aa; color: #fff; }
        button.danger { border-color: #c2410c; background: #c2410c; color: #fff; }
        input, select { min-height: 36px; border: 1px solid #cfd6df; border-radius: 6px; padding: 0 10px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #dbe2ea; }
        th, td { padding: 11px 12px; border-bottom: 1px solid #e7ebf0; text-align: left; font-size: 14px; }
        th { background: #eef2f6; color: #4b5563; }
        h1 { margin: 0; }
        .site-header { background: #fff; border-bottom: 1px solid #dde3ea; }
        .site-header__inner { max-width: 1180px; margin: 0 auto; min-height: 64px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .brand { display: inline-flex; align-items: center; gap: 10px; color: #172033; font-weight: 800; text-decoration: none; }
        .brand-mark { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; border-radius: 6px; background: #1769aa; color: #fff; font-size: 14px; }
        .brand-text { font-size: 16px; }
        .site-nav { display: flex; align-items: center; gap: 6px; }
        .site-nav__link { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 6px; border: none; color: #52606d; font-size: 14px; font-weight: 800; text-decoration: none; white-space: nowrap; background: transparent; }
        .site-nav__link:hover { background: #f1f5f9; color: #1769aa; }
        .site-nav__link.active { background: #e8f1fa; color: #1769aa; }
        .auth-actions { display: flex; align-items: center; gap: 8px; }
        .write-button { display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 0 14px; border-radius: 6px; border: none; background: #1769aa; color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; }
        .write-button--ghost { border: 1px solid #cfd6df; background: #fff; color: #1769aa; }
    </style>
    <script src="/js/auth-utils.js"></script>
</head>
<body>
<header class="site-header">
    <div class="site-header__inner">
        <a class="brand" href="/jobpostings">
            <span class="brand-mark">SR</span>
            <span class="brand-text">Smart Recruit</span>
        </a>
        <nav class="site-nav">
            <a class="site-nav__link" href="/jobpostings">채용 공고</a>
            <a class="site-nav__link" href="/communities">커뮤니티</a>
            <a class="site-nav__link" href="/dashboard">대시보드</a>
            <a class="site-nav__link active" href="/admin/dashboard">관리자</a>
        </nav>
        <div class="auth-actions">
            <div id="guestMenu"><a class="write-button" href="/auth/login">로그인</a></div>
            <div id="userMenu" style="display:none;gap:8px;">
                <a class="write-button write-button--ghost" href="/auth/mypage">내 정보</a>
                <button class="write-button" type="button" onclick="handleLogout()">로그아웃</button>
            </div>
        </div>
    </div>
</header>
<main class="page">
    <h1>유저 관리</h1>
    <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-bottom:24px;">
        <div style="border:1px solid #dbe2ea;border-radius:6px;background:#fff;padding:16px;">
            <div style="color:#667085;font-size:13px;">전체회원</div>
            <div style="margin-top:8px;font-size:28px;font-weight:800;" th:text="${totalMembers}">0</div>
        </div>
        <div style="border:1px solid #dbe2ea;border-radius:6px;background:#fff;padding:16px;">
            <div style="color:#667085;font-size:13px;">SEEKER</div>
            <div style="margin-top:8px;font-size:28px;font-weight:800;" th:text="${seekerCount}">0</div>
        </div>
        <div style="border:1px solid #dbe2ea;border-radius:6px;background:#fff;padding:16px;">
            <div style="color:#667085;font-size:13px;">ADMIN</div>
            <div style="margin-top:8px;font-size:28px;font-weight:800;" th:text="${adminCount}">0</div>
        </div>
    </section>
    <nav>
        <a href="/admin">대시보드</a>
        <a class="active" href="/admin/members">유저 관리</a>
        <a href="/admin/job-postings">공고 관리</a>
    </nav>

    <form method="get" action="/admin/members">
        <select name="role">
            <option value="">전체</option>
            <option th:each="role : ${roles}" th:value="${role.name()}" th:text="${role.name()}" th:selected="${currentFilters.role == role.name()}">SEEKER</option>
        </select>
        <input type="text" name="keyword" placeholder="이메일·닉네임" th:value="${currentFilters.keyword}">
        <button class="primary" type="submit">검색</button>
        <a class="reset" href="/admin/members">초기화</a>
    </form>

    <table>
        <thead>
        <tr>
            <th>번호</th>
            <th>이메일</th>
            <th>닉네임</th>
            <th>역할</th>
            <th>가입일</th>
            <th>역할변경</th>
            <th>메일 테스트</th>
            <th>삭제</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="member : ${members}" th:id="|member-${member.id}|">
            <td th:text="${member.id}">1</td>
            <td th:text="${member.email}">user@example.com</td>
            <td th:text="${member.nickname}">닉네임</td>
            <td th:text="${member.role.name()}">SEEKER</td>
            <td th:text="${member.createdAt}">2026-01-01</td>
            <td>
                <select th:id="|role-${member.id}|">
                    <option th:each="role : ${roles}" th:value="${role.name()}" th:text="${role.name()}" th:selected="${member.role == role}">SEEKER</option>
                </select>
                <button type="button" th:onclick="|changeRole(${member.id})|">변경</button>
            </td>
            <td>
                <button type="button"
                        th:attr="data-id=${member.id},data-email=${member.email}"
                        onclick="sendRecommendationMail(this.dataset.id, this.dataset.email)">추천 메일</button>
            </td>
            <td><button class="danger" type="button" th:onclick="|deleteMember(${member.id})|">삭제</button></td>
        </tr>
        </tbody>
    </table>
</main>
<script>
    // authHeaders() → auth-utils.js 에서 전역 제공

    function handleLogout() {
        localStorage.removeItem("accessToken");
        localStorage.removeItem("memberId");
        document.cookie = "accessToken=; path=/; max-age=0";
        location.href = "/auth/login";
    }

    function updateAuthNav() {
        const token = getToken();
        document.getElementById("guestMenu").style.display = token ? "none" : "";
        document.getElementById("userMenu").style.display = token ? "flex" : "none";
    }

    updateAuthNav();

    async function changeRole(id) {
        const role = document.getElementById(`role-${id}`).value;
        const response = await fetch(`/admin/members/${id}/role`, {
            method: 'PATCH',
            headers: authHeaders(),
            body: JSON.stringify({role})
        });
        if (response.ok) location.reload();
        else alert('역할 변경 실패');
    }

    async function sendRecommendationMail(id, email) {
        if (!confirm(email + '에게 추천 공고 이메일을 발송하시겠습니까?')) return;
        const response = await fetch(`/admin/members/${id}/send-recommendations`, {
            method: 'POST',
            headers: authHeaders()
        });
        const message = await response.text();
        alert(message || '추천 메일 발송 요청이 완료되었습니다.');
    }

    async function deleteMember(id) {
        if (!confirm('삭제하시겠습니까?')) return;
        const response = await fetch(`/admin/members/${id}`, {
            method: 'DELETE',
            headers: authHeaders()
        });
        if (response.ok) document.getElementById(`member-${id}`).remove();
        else alert('삭제 실패');
    }
</script>
</body>
</html>
