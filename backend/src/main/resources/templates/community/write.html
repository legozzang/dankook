<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 | Smart Recruit</title>
    <style>
        body { margin: 0; background: #f5f6f8; color: #222831; font-family: Arial, "Noto Sans KR", sans-serif; }
        .site-header { background: #fff; border-bottom: 1px solid #dde3ea; }
        .site-header__inner { max-width: 1120px; margin: 0 auto; min-height: 64px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .brand, .site-nav__link, .write-button, .back-link { text-decoration: none; }
        .brand { display: inline-flex; align-items: center; gap: 10px; color: #172033; font-weight: 800; }
        .brand-mark { display: inline-flex; width: 34px; height: 34px; align-items: center; justify-content: center; border-radius: 6px; background: #1769aa; color: #fff; }
        .site-nav { display: flex; align-items: center; gap: 6px; }
        .site-nav__link { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 6px; color: #52606d; font-size: 14px; font-weight: 800; text-decoration: none; white-space: nowrap; }
        .site-nav__link:hover { background: #f1f5f9; color: #1769aa; }
        .site-nav__link.active { background: #e8f1fa; color: #1769aa; }
        .auth-actions { display: flex; align-items: center; gap: 8px; }
        .write-button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 0; border-radius: 6px; background: #1769aa; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
        .write-button--ghost { border: 1px solid #cfd6df; background: #ffffff; color: #1769aa; }
        .page { max-width: 780px; margin: 0 auto; padding: 40px 20px; }
        .panel { background: #fff; border: 1px solid #dde3ea; border-radius: 6px; padding: 24px; }
        h1 { margin: 0 0 22px; font-size: 30px; letter-spacing: 0; }
        label { display: block; margin: 16px 0 8px; color: #344054; font-weight: 800; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #cfd6df; border-radius: 6px; box-sizing: border-box; font: inherit; }
        textarea { min-height: 260px; resize: vertical; }
        .job-attach { margin-top: 16px; }
        .job-attach label { display: block; margin-bottom: 8px; color: #344054; font-weight: 800; }
        .scrap-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border: 1px solid #cfd6df; border-radius: 6px; background: #fff; color: #344054; font-size: 14px; font-weight: 700; cursor: pointer; }
        .scrap-toggle:hover { border-color: #1769aa; color: #1769aa; }
        .scrap-list { margin-top: 8px; border: 1px solid #dde3ea; border-radius: 6px; background: #fff; max-height: 260px; overflow-y: auto; display: none; }
        .scrap-item { display: block; width: 100%; text-align: left; padding: 12px 16px; border: none; border-bottom: 1px solid #e7ebf0; background: transparent; cursor: pointer; }
        .scrap-item:last-child { border-bottom: none; }
        .scrap-item:hover { background: #f0f7ff; }
        .scrap-item__company { font-size: 12px; color: #52606d; margin-bottom: 3px; }
        .scrap-item__title { font-size: 14px; font-weight: 700; color: #172033; }
        .scrap-item__meta { font-size: 12px; color: #94a3b8; margin-top: 2px; }
        .scrap-empty { padding: 20px; text-align: center; color: #94a3b8; font-size: 14px; }
        .job-preview { margin-top: 8px; border: 1px solid #c8ddf5; border-radius: 6px; background: #f0f7ff; padding: 12px 16px; display: none; }
        .job-preview__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .job-preview__meta { font-size: 12px; color: #52606d; margin-bottom: 4px; display: flex; gap: 10px; }
        .job-preview__title { font-size: 14px; font-weight: 700; color: #172033; }
        .job-remove { padding: 2px 8px; border: 1px solid #cfd6df; border-radius: 4px; background: #fff; color: #667085; font-size: 12px; cursor: pointer; flex-shrink: 0; }
        .actions { margin-top: 20px; display: flex; justify-content: space-between; gap: 12px; }
        .back-link { color: #1769aa; font-weight: 800; }
        @media (max-width: 720px) {
            .site-header__inner { align-items: flex-start; flex-direction: column; }
            .page { padding: 28px 14px; }
            .actions { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
<header class="site-header">
    <div class="site-header__inner">
        <a class="brand" href="/jobpostings" aria-label="Smart Recruit 홈">
            <span class="brand-mark">SR</span>
            <span class="brand-text">Smart Recruit</span>
        </a>
        <nav class="site-nav" aria-label="주요 메뉴">
            <a class="site-nav__link" href="/jobpostings">채용 공고</a>
            <a class="site-nav__link active" href="/communities">커뮤니티</a>
            <a class="site-nav__link" href="/admin/dashboard" th:if="${isAdmin}">관리자</a>
        </nav>
        <div class="auth-actions">
            <div id="guestMenu"><a class="write-button" href="/auth/login">로그인</a></div>
            <div id="userMenu" style="display:none;gap:8px;">
                <a class="write-button write-button--ghost" href="/auth/mypage">내 정보</a>
                <button class="write-button" type="button" onclick="handleLogout()">로그아웃</button>
            </div>
        </div>
    </div>
</header>

<main class="page">
    <section class="panel">
        <h1>글쓰기</h1>
        <form id="writeForm">
            <label for="category">카테고리</label>
            <select id="category" required>
                <option value="INFO">정보</option>
                <option value="QNA">질문</option>
                <option value="FREE">자유</option>
            </select>
            <label for="title">제목</label>
            <input id="title" type="text" maxlength="200" required>
            <label for="content">내용</label>
            <textarea id="content" required></textarea>
            <div class="job-attach">
                <label>공고 첨부 (선택)</label>
                <input id="jobPostingId" type="hidden">
                <button class="scrap-toggle" type="button" id="scrapToggle">📋 스크랩한 공고에서 선택</button>
                <div class="scrap-list" id="scrapList"></div>
                <div class="job-preview" id="jobPreview"></div>
            </div>
            <div class="actions">
                <a class="back-link" href="/communities">목록으로 돌아가기</a>
                <button class="write-button" type="submit">등록</button>
            </div>
        </form>
    </section>
</main>
<script src="/js/auth-utils.js"></script>
<script>
    function updateAuthNav() {
        const token = getToken();
        document.getElementById("guestMenu").style.display = token ? "none" : "";
        document.getElementById("userMenu").style.display = token ? "flex" : "none";
    }

    function handleLogout() {
        localStorage.removeItem("accessToken");
        localStorage.removeItem("memberId");
        document.cookie = "accessToken=; path=/; max-age=0";
        location.href = "/auth/login";
    }

    if (!getToken()) {
        location.href = "/auth/login";
    }

    const scrapToggle = document.getElementById("scrapToggle");
    const scrapList = document.getElementById("scrapList");
    const jobPostingIdInput = document.getElementById("jobPostingId");
    const jobPreview = document.getElementById("jobPreview");
    let scrapsLoaded = false;

    function clearAttachedJob() {
        jobPostingIdInput.value = "";
        jobPreview.innerHTML = "";
        jobPreview.style.display = "none";
        scrapToggle.style.display = "";
    }

    function escapeHtml(value) {
        const el = document.createElement("div");
        el.textContent = value || "";
        return el.innerHTML;
    }

    function selectScrap(item) {
        jobPostingIdInput.value = item.job_posting_id;
        jobPreview.innerHTML = `
            <div class="job-preview__head">
                <div>
                    <div class="job-preview__meta">
                        <span>${escapeHtml(item.company)}</span>
                        <span>${escapeHtml(item.location)}</span>
                        <span>${escapeHtml(item.deadline)}</span>
                    </div>
                    <div class="job-preview__title">${escapeHtml(item.title)}</div>
                </div>
                <button class="job-remove" type="button" aria-label="첨부 해제">해제</button>
            </div>
        `;
        jobPreview.style.display = "block";
        jobPreview.querySelector(".job-remove").addEventListener("click", clearAttachedJob);
        scrapList.style.display = "none";
        scrapToggle.style.display = "none";
    }

    function renderScrapList(scraps) {
        if (scraps.length === 0) {
            scrapList.innerHTML = '<div class="scrap-empty">스크랩한 공고가 없습니다.</div>';
        } else {
            scrapList.innerHTML = scraps.map((item, i) => `
                <button class="scrap-item" type="button" data-idx="${i}">
                    <div class="scrap-item__company">${escapeHtml(item.company)}</div>
                    <div class="scrap-item__title">${escapeHtml(item.title)}</div>
                    <div class="scrap-item__meta">${escapeHtml(item.location)} · 마감 ${escapeHtml(item.deadline)}</div>
                </button>
            `).join("");
            scrapList.querySelectorAll(".scrap-item").forEach((btn) => {
                btn.addEventListener("click", () => selectScrap(scraps[Number(btn.dataset.idx)]));
            });
        }
        scrapList.style.display = "block";
    }

    scrapToggle.addEventListener("click", async () => {
        if (getComputedStyle(scrapList).display !== "none") {
            scrapList.style.display = "none";
            return;
        }
        if (scrapsLoaded) {
            scrapList.style.display = "block";
            return;
        }
        try {
            const res = await fetch("/api/scraps/my", { headers: authHeaders() });
            if (!res.ok) throw new Error();
            renderScrapList(await res.json());
            scrapsLoaded = true;
        } catch {
            scrapList.innerHTML = '<div class="scrap-empty">스크랩 목록을 불러오지 못했습니다.</div>';
            scrapList.style.display = "block";
        }
    });

    document.getElementById("writeForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const payload = {
            category: document.getElementById("category").value,
            title: document.getElementById("title").value.trim(),
            content: document.getElementById("content").value.trim(),
            job_posting_id: jobPostingIdInput.value ? Number(jobPostingIdInput.value) : null
        };
        if (!payload.title || !payload.content) {
            alert("제목과 내용을 입력해주세요.");
            return;
        }
        try {
            const response = await fetch("/api/communities", {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify(payload)
            });
            if (response.status === 401) {
                alert("로그인이 필요합니다. 로그인 페이지로 이동합니다.");
                location.href = "/auth/login?redirect=/communities/write";
                return;
            }
            if (!response.ok) {
                const msg = await response.text().catch(() => "");
                alert(msg || "게시글 작성에 실패했습니다.");
                return;
            }
            location.href = "/communities";
        } catch (error) {
            alert("게시글 작성에 실패했습니다.");
        }
    });

    updateAuthNav();
</script>
</body>
</html>
