<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채용 공고 | Smart Recruit</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" th:href="@{/css/job-map.css}">
</head>
<body>
<main class="page">
    <div class="header">
        <h1>채용 공고</h1>
        <a class="write-button" href="#">공고 등록</a>
    </div>

    <section class="layout" th:with="jobCount=${#lists.size(jobPostings)}">
        <div class="map-panel" aria-label="채용 공고 지도">
            <div id="jobMap"></div>
        </div>

        <aside class="list-panel" aria-label="채용 공고 목록">
            <div class="filters">
                <div class="recommendation-summary" role="status" aria-live="polite">
                    <strong id="recommendationMessage"
                            th:text="|등록된 공고 ${jobCount}개를 확인할 수 있어요.|">등록된 공고 0개를 확인할 수 있어요.</strong>
                    <span id="locationModeLabel">기본 지역: 단국대학교 죽전캠퍼스</span>
                </div>

                <div>
                    <p class="filter-title">반경 필터</p>
                    <div class="filter-row" role="group" aria-label="반경 필터">
                        <button class="filter-button active" type="button" data-radius="all">전체</button>
                        <button class="filter-button" type="button" data-radius="1">1km</button>
                        <button class="filter-button" type="button" data-radius="3">3km</button>
                        <button class="filter-button" type="button" data-radius="5">5km</button>
                    </div>
                </div>

                <span class="result-count"><strong id="visibleCount" th:text="${jobCount}">0</strong>개의 공고</span>
            </div>

            <div class="cards" id="jobCards">
                <p class="empty" th:if="${#lists.isEmpty(jobPostings)}">아직 등록된 채용 공고가 없습니다.</p>
                <p class="empty" id="filteredEmpty" hidden>조건에 맞는 채용 공고가 없습니다.</p>

                <article class="job-card"
                         th:each="jobPosting : ${jobPostings}"
                         th:id="|job-${jobPosting.id}|"
                         th:data-id="${jobPosting.id}"
                         th:data-title="${jobPosting.title}"
                         th:data-company="${jobPosting.companyName}"
                         th:data-location="${jobPosting.location}"
                         th:data-region-sido="${jobPosting.regionSido}"
                         th:data-region-sigungu="${jobPosting.regionSigungu}"
                         th:data-salary="${jobPosting.salary}"
                         th:data-deadline="${jobPosting.deadline}"
                         th:data-dong="${jobPosting.dong}"
                         th:data-job-type="${jobPosting.jobType}"
                         th:data-status="${jobPosting.status}"
                         th:data-ai-reason="${jobPosting.aiReason}"
                         th:data-base-score="${jobPosting.recommendationScore}"
                         th:data-recommendation-score="${jobPosting.recommendationScore}"
                         th:data-recommendation-level="${jobPosting.recommendationLevel}"
                         th:data-lat="${jobPosting.latitude}"
                         th:data-lng="${jobPosting.longitude}"
                         th:data-exact-location="${jobPosting.exactLocation}">
                    <div class="card-head">
                        <div>
                            <p class="company" th:text="${jobPosting.companyName}">회사명</p>
                            <h2 class="job-title" th:text="${jobPosting.title}">공고 제목</h2>
                        </div>

                        <div class="job-tags" aria-label="공고 추천 정보">
                            <span class="job-tag recommendation-tag"
                                  th:classappend="${jobPosting.recommendationLevel}"
                                  title="추천도">
                                추천도 <strong class="recommendation-score" th:text="${jobPosting.recommendationScore}">70</strong>
                            </span>
                            <span class="job-tag"
                                  th:text="${#strings.isEmpty(jobPosting.jobType) ? '직종 미등록' : jobPosting.jobType}">직종</span>
                            <span class="job-tag status-tag"
                                  th:classappend="${jobPosting.status == 'CLOSED' ? ' closed' : ' open'}"
                                  th:text="${jobPosting.status == 'CLOSED' ? '마감' : '진행중'}">진행중</span>
                        </div>
                    </div>

                    <div class="meta-grid">
                        <div class="meta-item">
                            <span class="meta-label">위치</span>
                            <span class="meta-value" th:text="${jobPosting.location}">죽전동</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">거리</span>
                            <span class="meta-value distance-value">거리 계산 중</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">시급/급여</span>
                            <span class="meta-value" th:text="${jobPosting.salary}">급여 협의</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">근무시간</span>
                            <span class="meta-value" th:text="${jobPosting.workTime}">근무시간 협의</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">마감일</span>
                            <span class="meta-value" th:text="${jobPosting.deadline}">마감일 미정</span>
                        </div>
                    </div>

                    <p class="recommendation-reason">
                        <span>AI 추천 사유</span>
                        <strong class="recommendation-reason-text" th:text="${jobPosting.aiReason}">근무 조건이 명확한 공고입니다.</strong>
                    </p>

                    <ul class="summary" aria-label="AI 요약">
                        <li th:each="line : ${jobPosting.summaryLines}" th:text="${line}">핵심 조건 요약</li>
                    </ul>

                    <span class="location-badge"
                          th:classappend="${jobPosting.exactLocation} ? '' : ' pending'"
                          th:text="${jobPosting.exactLocation} ? '실제 위치' : '좌표 미등록 - 임시 위치'">실제 위치</span>

                    <a class="detail-link" th:href="@{/jobpostings/{id}(id=${jobPosting.id})}">상세 보기</a>
                </article>
            </div>
        </aside>
    </section>
</main>

<script>
    window.JobMapConfig = {
        defaultOrigin: {lat: 37.3216, lng: 127.1267},
        defaultRegionLabel: "단국대학교 죽전캠퍼스"
    };
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/job-list.js}"></script>
<script th:src="@{/js/filters.js}"></script>
<script th:src="@{/js/user-location.js}"></script>
<script th:src="@{/js/map.js}"></script>
</body>
</html>
