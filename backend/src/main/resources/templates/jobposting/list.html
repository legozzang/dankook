    목적 : /jobpostings 를 위한 지도형 채용 공고 화면
    수정 이력 : 2026.05.18 (1, 3, 5km 거리별 필터 업데이트)
               2026.06.06 (스크랩 버튼 추가)

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채용 공고 | Smart Recruit</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/css/job-map.css">
</head>
<body>
<header class="site-header">
    <div class="site-header__inner">
        <a class="brand" href="/jobpostings" aria-label="Smart Recruit 홈">
            <span class="brand-mark">SR</span>
            <span class="brand-text">Smart Recruit</span>
        </a>

        <nav class="site-nav" aria-label="주요 메뉴">
            <a class="site-nav__link active" href="/jobpostings">채용 공고</a>
            <a class="site-nav__link" href="/communities">커뮤니티</a>
            <a class="site-nav__link" href="/dashboard">대시보드</a>
            <a class="site-nav__link" href="/admin/dashboard" th:if="${isAdmin}">관리자</a>
        </nav>

        <div class="auth-actions">
            <div id="guestMenu">
                <a class="write-button" href="/auth/login">로그인</a>
            </div>
            <div id="userMenu" style="display:none;gap:8px;">
                <a class="write-button write-button--ghost" href="/auth/mypage">내 정보</a>
                <button class="write-button" type="button" onclick="handleLogout()">로그아웃</button>
            </div>
        </div>
    </div>
</header>

<main class="page">
    <section class="layout" th:with="jobCount=${#lists.size(jobPostings)}">
        <div class="map-panel" aria-label="채용 공고 지도">
            <div class="map-help">
                <button id="resetCenter" class="reset-center-button" type="button" style="display:none">중심 초기화</button>
            </div>
            <div id="jobMap"></div>
        </div>

        <aside class="list-panel" aria-label="채용 공고 목록">
            <div id="jobListTabs" class="filter-row" style="gap:8px;padding:10px;border-bottom:1px solid #e5eaf0;">
                <button class="filter-button active" type="button" id="allJobsTab">전체 공고</button>
                <button class="filter-button" type="button" id="recommendationsTab">맞춤 추천</button>
            </div>
            <input id="keywordInput" type="text" placeholder="공고 제목 검색..."
                   style="width:100%;height:44px;padding:10px 16px;font-size:16px;border:1px solid #cfd6df;border-radius:6px;margin-bottom:0;box-sizing:border-box;">
            <button type="button" id="filterToggle" aria-expanded="false" aria-controls="filtersBody"
                    style="width:100%;padding:10px 16px;border:none;border-bottom:1px solid #e5eaf0;
                           background:#f6f8fb;text-align:left;font-size:13px;font-weight:700;
                           color:#52606d;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
                <span>필터</span>
                <span id="filterToggleIcon">▼</span>
            </button>
            <div class="filters collapsed" id="filtersBody">
                <div class="filter-group">
                    <p class="filter-title">지역 필터</p>
                    <div class="filter-row">
                        <select id="filterSido">
                            <option value="all">시/도 전체</option>
                            <option th:each="sido : ${sidos}" th:value="${sido}" th:text="${sido}">서울</option>
                        </select>
                        <select id="filterSigungu" disabled>
                            <option value="all">시/군/구 전체</option>
                        </select>
                    </div>
                </div>
                <div class="filter-group">
                    <p class="filter-title">직업 필터</p>
                    <div class="filter-row">
                        <select id="filterJobMajor">
                            <option value="all">대분류 전체</option>
                            <option th:each="major : ${jobMajors}" th:value="${major}" th:text="${major}">대분류</option>
                        </select>
                        <select id="filterJobMid" disabled>
                            <option value="all">중분류 전체</option>
                        </select>
                    </div>
                </div>
                <div class="filter-group">
                    <p class="filter-title">급여유형</p>
                    <div class="filter-row">
                        <select id="filterPayType">
                            <option value="all">전체</option>
                            <option th:each="pt : ${payTypes}" th:value="${pt}" th:text="${pt}">월급</option>
                        </select>
                    </div>
                </div>
                <div class="filter-group">
                    <p class="filter-title">반경 필터</p>
                    <div class="filter-row" role="group" aria-label="반경 필터">
                        <button class="filter-button" type="button" data-radius="all">전체</button>
                        <button class="filter-button" type="button" data-radius="1">1km</button>
                        <button class="filter-button active" type="button" data-radius="3">3km</button>
                        <button class="filter-button" type="button" data-radius="5">5km</button>
                    </div>
                </div>
                <div class="filter-group filter-group--wide">
                    <p class="filter-title">정렬</p>
                    <div class="filter-row">
                        <button class="filter-button active" type="button" id="sortDistanceBtn">거리순</button>
                        <button class="filter-button" type="button" id="sortSalaryBtn"
                                disabled title="급여유형을 선택하세요">급여순</button>
                    </div>
                </div>
                <div class="filter-actions">
                    <label class="result-limit-label" for="resultLimit">결과 수</label>
                    <select id="resultLimit">
                        <option value="10">10개</option>
                        <option value="50" selected>50개</option>
                        <option value="100">100개</option>
                        <option value="all">전체</option>
                    </select>
                    <button id="searchBtn" type="button" class="filter-button filter-button--primary">검색</button>
                    <button id="resetBtn" type="button" class="filter-button">초기화</button>
                </div>
                <!--
                <div>
                    <p class="filter-title">행정동 기준</p>
                    <div class="filter-row" role="group" aria-label="행정동 필터">
                        <button class="filter-button active" type="button" data-dong="all">전체</button>
                        <button class="filter-button" type="button" th:each="dong : ${dongs}" th:data-dong="${dong}" th:text="${dong}">죽전동</button>
                    </div>
                </div>
                -->
                <div class="result-summary">
                    <span class="result-count"><strong id="visibleCount" th:text="${jobCount}">0</strong>개의 공고</span>
                    <span>지도 마커를 선택하면 목록 위치가 함께 표시됩니다.</span>
                </div>
            </div>

            <div class="cards">
                <p class="empty" th:if="${#lists.isEmpty(jobPostings)}">아직 등록된 채용 공고가 없습니다.</p>

                <article class="job-card"
                         th:each="jobPosting : ${jobPostings}"
                         th:id="|job-${jobPosting.id}|"
                         th:data-id="${jobPosting.id}"
                         th:data-title="${jobPosting.title}"
                         th:data-company="${jobPosting.companyName}"
                         th:data-location="${jobPosting.location}"
                         th:data-salary="${jobPosting.salary}"
                         th:data-deadline="${jobPosting.deadline}"
                         th:data-dong="${jobPosting.dong}"
                         th:data-sido="${jobPosting.sido}"
                         th:data-sigungu="${jobPosting.sigungu}"
                         th:data-job-major="${jobPosting.jobTypeMajor}"
                         th:data-job-mid="${jobPosting.jobTypeMid}"
                         th:data-recommendation-reason="${jobPosting.recommendationReason}"
                         th:data-lat="${jobPosting.latitude}"
                         th:data-lng="${jobPosting.longitude}"
                         th:data-exact-location="${jobPosting.exactLocation}">
                    <div>
                        <p class="company" th:text="${jobPosting.companyName}">회사명</p>
                        <h2 class="job-title" th:text="${jobPosting.title}">공고 제목</h2>
                    </div>

                    <div class="meta-grid">
                        <div class="meta-item">
                            <span class="meta-label">위치</span>
                            <span class="meta-value" th:text="${jobPosting.location}">죽전동</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">시급/급여</span>
                            <span class="meta-value" th:text="${jobPosting.salary}">급여 협의</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">근무시간</span>
                            <span class="meta-value" th:text="${jobPosting.workTime}">근무시간 협의</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">마감일</span>
                            <span class="meta-value" th:text="${jobPosting.deadline}">마감일 미정</span>
                        </div>
                    </div>

                    <ul class="summary" aria-label="AI 요약">
                        <li th:if="${jobPosting.recommendationReason != null and jobPosting.recommendationReason != ''}"
                            th:text="|추천 이유: ${jobPosting.recommendationReason}|">추천 이유</li>
                        <li th:each="line : ${jobPosting.summaryLines}" th:text="${line}">핵심 조건 요약</li>
                    </ul>

                    <span class="location-badge"
                          th:classappend="${jobPosting.exactLocation} ? '' : ' pending'"
                          th:text="${jobPosting.exactLocation} ? '실제 위치' : '좌표 미등록 - 임시 위치'">실제 위치</span>

                    <!-- 카드 하단 액션 행 -->
                    <div class="card-actions">
                        <a class="detail-link"
                           th:with="hasExternal=${jobPosting.externalUrl != null and !jobPosting.externalUrl.isBlank()}"
                           th:href="${hasExternal} ? ${jobPosting.externalUrl} : @{/jobpostings/{id}(id=${jobPosting.id})}"
                           th:target="${hasExternal} ? '_blank' : '_self'"
                           th:rel="${hasExternal} ? 'noopener' : null">상세 보기</a>
                        <button class="scrap-btn"
                                th:classappend="${jobPosting.scraped} ? ' scrapped' : ''"
                                type="button"
                                th:data-id="${jobPosting.id}"
                                th:data-scraped="${jobPosting.scraped}"
                                aria-label="스크랩"
                                th:text="${jobPosting.scraped} ? '★' : '☆'">☆</button>
                    </div>
                </article>
            </div>
        </aside>
    </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    window.JobMapConfig = {
        sigunguBySido: JSON.parse(/*[[${sigunguBySidoJson}]]*/ '{}'),
        jobMidByMajor: JSON.parse(/*[[${jobTypeMidByMajorJson}]]*/ '{}'),
        defaultCenter: {lat: 37.3216, lng: 127.1267}
    };
</script>
<script src="/js/auth-utils.js"></script>
<script src="/js/job-map.js"></script>
</body>
</html>
