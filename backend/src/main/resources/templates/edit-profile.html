<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart Recruit - 정보 수정</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f5f7fa;
            font-family: system-ui, -apple-system, 'Noto Sans KR', sans-serif;
            color: #1f2937;
            min-height: 100vh;
            padding: 40px 16px;
        }
        .page { max-width: 680px; margin: 0 auto; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; color: #111827; }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
            padding: 28px 32px;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 6px;
            letter-spacing: .2px;
        }
        input[type="text"],
        input[type="password"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #1f2937;
            background: #fff;
            transition: border-color .15s;
            appearance: none;
            -webkit-appearance: none;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #1769aa;
            box-shadow: 0 0 0 3px rgba(23,105,170,.1);
        }
        select:disabled { background: #f9fafb; color: #9ca3af; cursor: not-allowed; }
        .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
        .pay-row { display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: end; }
        .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        .btn {
            padding: 11px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background .15s, transform .1s;
        }
        .btn:active { transform: scale(.98); }
        .btn-primary { background: #1769aa; color: #fff; }
        .btn-primary:hover { background: #145890; }
        .btn-secondary { background: #f1f5f9; color: #4b5563; }
        .btn-secondary:hover { background: #e5e9ef; }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            gap: 16px;
        }
        .toggle-label { font-size: 14px; color: #1f2937; }
        .toggle-hint { font-size: 12px; color: #9ca3af; margin-top: 2px; }
        .toggle-switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            inset: 0;
            background: #d1d5db;
            border-radius: 24px;
            cursor: pointer;
            transition: background .2s;
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform .2s;
        }
        .toggle-switch input:checked + .toggle-slider { background: #1769aa; }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
        @media (max-width: 720px) {
            .card { padding: 22px 20px; }
            .grid-2, .grid-3, .grid-4, .pay-row { grid-template-columns: 1fr; }
            .actions { flex-direction: column-reverse; }
            .btn { width: 100%; }
        }
    </style>
    <script src="/js/auth-utils.js"></script>
</head>
<body>
<div class="page">
    <h1 class="page-title">내 정보 수정</h1>

    <div class="card">
        <div class="section-title">계정 정보</div>
        <div class="form-group">
            <label for="nicknameInput">닉네임</label>
            <input type="text" id="nicknameInput" placeholder="새 닉네임 입력">
        </div>
        <div class="toggle-row" style="margin-top:8px">
            <div>
                <div class="toggle-label">이메일로 정보 받기</div>
                <div class="toggle-hint">채용 추천, 공고 알림 등을 이메일로 받습니다</div>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" id="emailNotification">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <div class="card">
        <div class="section-title">비밀번호 변경</div>
        <p class="hint" style="margin-bottom:16px">변경하지 않으려면 비워두세요.</p>
        <div class="grid-2">
            <div class="form-group">
                <label for="currentPassword">현재 비밀번호</label>
                <input type="password" id="currentPassword" placeholder="현재 비밀번호">
            </div>
            <div class="form-group">
                <label for="newPassword">새 비밀번호</label>
                <input type="password" id="newPassword" placeholder="새 비밀번호">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">선호 조건</div>
        <div class="form-group">
            <label>관심 지역</label>
            <p class="hint" style="margin-bottom:10px">관심 지역 1은 기본 지역이며, 관심 지역 2·3은 선택 입력입니다.</p>
            <div class="form-group">
                <label>관심 지역 1 (내 거주지)</label>
                <div class="grid-2">
                    <select id="region1Sido"><option value="">시/도</option></select>
                    <select id="region1Sigungu" disabled><option value="">시/군/구</option></select>
                </div>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <input type="text" id="region1Detail" placeholder="상세 주소 (예: 죽전로 152 / OO아파트 101동)" style="flex:1;" />
                    <button type="button" id="pickFromMapBtn" style="width:110px;height:44px;border:1px solid #1769aa;border-radius:10px;background:#fff;color:#1769aa;font-weight:800;cursor:pointer;flex-shrink:0;">지도에서 선택</button>
                </div>
                <p class="hint" style="margin-top:6px">시/도·시/군/구를 선택하고 상세 주소를 입력해주세요. 또는 <strong>지도에서 선택</strong>으로 위치를 찍어도 됩니다.</p>
                <p id="addressStatus" style="margin:6px 0 0;font-size:13px;font-weight:700;"></p>
                <p id="mapPickHint" style="display:none;font-size:12px;color:#667085;margin:6px 0 4px;">
                    지도를 클릭하면 해당 위치의 주소가 자동으로 입력됩니다.
                </p>
                <div id="addressMap" style="display:none;height:200px;margin-top:8px;border:1px solid #d7dde4;border-radius:10px;overflow:hidden;"></div>
            </div>
            <div class="form-group">
                <label>관심 지역 2</label>
                <div class="grid-2">
                    <select id="region2Sido"><option value="">시/도</option></select>
                    <select id="region2Sigungu" disabled><option value="">시/군/구</option></select>
                </div>
            </div>
            <div class="form-group">
                <label>관심 지역 3</label>
                <div class="grid-2">
                    <select id="region3Sido"><option value="">시/도</option></select>
                    <select id="region3Sigungu" disabled><option value="">시/군/구</option></select>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>희망 직종</label>
            <div class="grid-4">
                <select id="jobMajor"><option value="">대분류</option></select>
                <select id="jobMid" disabled><option value="">중분류</option></select>
                <select id="jobMinor" disabled><option value="">소분류</option></select>
                <select id="jobDetail" disabled><option value="">세분류</option></select>
            </div>
        </div>

        <div class="pay-row">
            <div class="form-group">
                <label for="preferredPayType">선호 급여 유형</label>
                <select id="preferredPayType">
                    <option value="">선택 안 함</option>
                    <option value="시급">시급</option>
                    <option value="일급">일급</option>
                    <option value="주급">주급</option>
                    <option value="월급">월급</option>
                    <option value="연봉">연봉</option>
                </select>
            </div>
            <div class="form-group">
                <label for="minPayAmount">최소 희망 급여 (원)</label>
                <input type="number" id="minPayAmount" placeholder="예: 2000000">
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-secondary" onclick="location.href='/auth/mypage'">취소</button>
        <button class="btn btn-primary" onclick="handleUpdate()">저장하기</button>
    </div>
</div>
    <script th:inline="javascript">
        const KSCO_RAW = /*[[${kscoHierarchyJson}]]*/ '{}';
        const KSCO = typeof KSCO_RAW === 'string' ? JSON.parse(KSCO_RAW || '{}') : (KSCO_RAW || {});
        const SIGUNGU_BY_SIDO_RAW = /*[[${sigunguBySidoJson}]]*/ '{}';
        const SIGUNGU_BY_SIDO = typeof SIGUNGU_BY_SIDO_RAW === 'string'
            ? JSON.parse(SIGUNGU_BY_SIDO_RAW || '{}')
            : (SIGUNGU_BY_SIDO_RAW || {});
        const SIDO_COORDS = {
            '서울특별시':[37.5665,126.9780],'부산광역시':[35.1796,129.0756],
            '대구광역시':[35.8714,128.6014],'인천광역시':[37.4563,126.7052],
            '광주광역시':[35.1595,126.8526],'대전광역시':[36.3504,127.3845],
            '울산광역시':[35.5384,129.3114],'세종특별자치시':[36.4801,127.2890],
            '경기도':[37.4138,127.5183],'강원도':[37.8228,128.1555],
            '충청북도':[36.6358,127.4914],'충청남도':[36.6588,126.6728],
            '전라북도':[35.7175,127.1530],'전라남도':[34.8679,126.9910],
            '경상북도':[36.4919,128.8889],'경상남도':[35.4606,128.2132],
            '제주특별자치도':[33.4890,126.4983]
        };
        document.addEventListener('DOMContentLoaded', () => {
            loadMemberInfo();
            setupAddressVerification();
        });

        // getToken() / authHeaders() → auth-utils.js 에서 전역 제공

        function resetSelect(select, placeholder = '전체') {
            select.innerHTML = `<option value="">${placeholder}</option>`;
            select.disabled = true;
        }

        function fillSelect(select, values, selected = '') {
            const placeholder = selected === '시/군/구' ? '시/군/구' : '전체';
            const selectedValue = selected === '시/군/구' ? '' : selected;
            resetSelect(select, placeholder);
            values.forEach(value => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = value;
                select.appendChild(option);
            });
            select.disabled = values.length === 0;
            select.value = selectedValue || '';
        }

        function findSelectValue(select, value) {
            if (!value) return '';
            for (const opt of select.options) {
                if (opt.value === value) return value;
            }
            const norm = {
                '서울':'서울특별시','부산':'부산광역시','대구':'대구광역시',
                '인천':'인천광역시','광주':'광주광역시','대전':'대전광역시',
                '울산':'울산광역시','세종':'세종특별자치시','경기':'경기도',
                '강원':'강원도','충북':'충청북도','충남':'충청남도',
                '전북':'전라북도','전남':'전라남도','경북':'경상북도',
                '경남':'경상남도','제주':'제주특별자치도'
            };
            const denorm = Object.fromEntries(Object.entries(norm).map(([key, mapped]) => [mapped, key]));
            for (const alt of [norm[value], denorm[value]].filter(Boolean)) {
                for (const opt of select.options) {
                    if (opt.value === alt) return alt;
                }
            }
            for (const opt of select.options) {
                if (opt.value && opt.value.startsWith(value)) return opt.value;
            }
            return '';
        }

        function setupRegionCascade(rank) {
            const sido = document.getElementById(`region${rank}Sido`);
            const sigungu = document.getElementById(`region${rank}Sigungu`);

            fillSelect(sido, Object.keys(SIGUNGU_BY_SIDO));
            sido.disabled = false;

            sido.addEventListener('change', () => {
                fillSelect(sigungu, SIGUNGU_BY_SIDO[sido.value] || []);
            });
        }

        function setupJobCascade() {
            const major = document.getElementById('jobMajor');
            const mid = document.getElementById('jobMid');
            const minor = document.getElementById('jobMinor');
            const detail = document.getElementById('jobDetail');

            fillSelect(major, Object.keys(KSCO));
            major.disabled = false;

            major.addEventListener('change', () => {
                fillSelect(mid, Object.keys(KSCO[major.value] || {}));
                resetSelect(minor);
                resetSelect(detail);
            });

            mid.addEventListener('change', () => {
                fillSelect(minor, Object.keys(KSCO[major.value]?.[mid.value] || {}));
                resetSelect(detail);
            });

            minor.addEventListener('change', () => {
                fillSelect(detail, Object.keys(KSCO[major.value]?.[mid.value]?.[minor.value] || {}));
            });
        }

        function setRegionValue(rank, sidoValue, sigunguValue) {
            const sido = document.getElementById(`region${rank}Sido`);
            const sigungu = document.getElementById(`region${rank}Sigungu`);

            sido.value = sidoValue || '';
            fillSelect(sigungu, SIGUNGU_BY_SIDO[sido.value] || [], '시/군/구');
            sigungu.value = sigunguValue || '';
        }

        function setRegionValues(data) {
            setRegionValue(1, data.desired_region_sido, data.desired_region_sigungu);
            setRegionValue(2, data.desired_region2_sido, data.desired_region2_sigungu);
            setRegionValue(3, data.desired_region3_sido, data.desired_region3_sigungu);
            const detail = document.getElementById('region1Detail');
            if (detail) {
                const saved = data.home_address ?? data.homeAddress ?? '';
                detail.value = saved;
                // 이미 저장(지오코딩 완료)된 주소는 확인된 것으로 간주
                if (saved) {
                    addressVerified = true;
                    verifiedAddress = saved;
                }
            }
        }

        // ── 주소 확인(지오코딩 미리보기) 상태 ─────────────────────────────
        let addressVerified = false;
        let verifiedAddress = '';
        let previewMap = null;
        let previewMarker = null;
        let mapClickEnabled = false;

        function setAddressStatus(text, color) {
            const el = document.getElementById('addressStatus');
            el.textContent = text;
            el.style.color = color;
        }

        function invalidateAddress() {
            addressVerified = false;
            verifiedAddress = '';
            setAddressStatus('', '');
        }

        function showPreviewMap(lat, lng) {
            const mapEl = document.getElementById('addressMap');
            mapEl.style.display = 'block';
            if (!previewMap) {
                previewMap = L.map(mapEl).setView([lat, lng], 16);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19, attribution: '&copy; OpenStreetMap'
                }).addTo(previewMap);
            } else {
                previewMap.setView([lat, lng], 16);
            }
            if (previewMarker) previewMarker.remove();
            previewMarker = L.marker([lat, lng]).addTo(previewMap);
            setTimeout(() => previewMap.invalidateSize(), 100);
        }

        function updateMapZoom() {
            if (!previewMap) return;
            const _sidoVal = document.getElementById('region1Sido').value;
            const _sigunguVal = document.getElementById('region1Sigungu').value;
            const _detailVal = document.getElementById('region1Detail').value.trim();
            if (_detailVal) {
                (async () => {
                    try {
                        const r = await fetch('/auth/geocode/preview', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ sido: _sidoVal, sigungu: _sigunguVal, detail: _detailVal })
                        });
                        if (r.ok) { const c = await r.json(); previewMap.setView([c.latitude, c.longitude], 16); }
                    } catch(e) {}
                })();
            } else if (_sigunguVal) {
                (async () => {
                    try {
                        const r = await fetch('/auth/geocode/preview', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ sido: '', sigungu: '', detail: _sidoVal + ' ' + _sigunguVal })
                        });
                        if (r.ok) { const c = await r.json(); previewMap.setView([c.latitude, c.longitude], 13); }
                    } catch(e) {}
                })();
            } else if (_sidoVal && SIDO_COORDS[_sidoVal]) {
                previewMap.setView(SIDO_COORDS[_sidoVal], 9);
            } else if (previewMarker) {
                previewMap.setView(previewMarker.getLatLng(), 16);
            }
        }

        function setupAddressVerification() {
            const detailInput = document.getElementById('region1Detail');
            const pickFromMapBtn = document.getElementById('pickFromMapBtn');
            const mapPickHint = document.getElementById('mapPickHint');
            const mapEl = document.getElementById('addressMap');

            detailInput.addEventListener('input', invalidateAddress);
            document.getElementById('region1Sido').addEventListener('change', () => {
                invalidateAddress();
                detailInput.value = '';
                if (document.getElementById('addressMap').style.display !== 'none') updateMapZoom();
            });
            document.getElementById('region1Sigungu').addEventListener('change', () => {
                invalidateAddress();
                detailInput.value = '';
                if (document.getElementById('addressMap').style.display !== 'none') updateMapZoom();
            });

            pickFromMapBtn.addEventListener('click', () => {
                mapEl.style.display = 'block';
                mapPickHint.style.display = 'block';

                if (typeof L === 'undefined') {
                    setAddressStatus('지도 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.', '#b42318');
                    mapEl.style.display = 'none';
                    mapPickHint.style.display = 'none';
                    return;
                }

                if (!previewMap) {
                    previewMap = L.map(mapEl).setView([36.5, 127.5], 7);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19, attribution: '&copy; OpenStreetMap'
                    }).addTo(previewMap);
                }

                updateMapZoom();

                mapEl.style.cursor = 'crosshair';
                setTimeout(() => previewMap.invalidateSize(), 100);

                if (mapClickEnabled) {
                    return;
                }
                mapClickEnabled = true;

                previewMap.on('click', async (e) => {
                    const { lat, lng } = e.latlng;
                    if (previewMarker) {
                        previewMarker.setLatLng([lat, lng]);
                    } else {
                        previewMarker = L.marker([lat, lng]).addTo(previewMap);
                    }

                    setAddressStatus('주소 조회 중...', '#667085');
                    try {
                        const res = await fetch(`/auth/geocode/reverse?lat=${lat}&lng=${lng}`);
                        if (!res.ok) {
                            setAddressStatus('해당 위치의 주소를 찾을 수 없습니다.', '#b42318');
                            return;
                        }

                        const data = await res.json();
                        const sido = document.getElementById('region1Sido');
                        const sigungu = document.getElementById('region1Sigungu');
                        const detail = document.getElementById('region1Detail');
                        const detailAddress = data.detail_address || data.detailAddress || '';

                        const sidoVal = findSelectValue(sido, data.sido || '');
                        sido.value = sidoVal;
                        fillSelect(sigungu, SIGUNGU_BY_SIDO[sidoVal] || [], '시/군/구');
                        sigungu.value = findSelectValue(sigungu, data.sigungu || '');
                        detail.value = detailAddress;

                        addressVerified = true;
                        verifiedAddress = detailAddress;
                        mapEl.style.display = 'block';
                        mapPickHint.style.display = 'block';
                        setTimeout(() => previewMap.invalidateSize(), 100);
                        setAddressStatus('✓ 지도에서 위치가 선택되었습니다.', '#1f6fb2');
                    } catch (e) {
                        setAddressStatus('주소 조회 중 오류가 발생했습니다.', '#b42318');
                    }
                });
            });
        }

        function readRegion(rank) {
            return {
                sido: document.getElementById(`region${rank}Sido`).value,
                sigungu: document.getElementById(`region${rank}Sigungu`).value
            };
        }

        function validateRegions(regions) {
            const incompleteRegion = regions.some(region => {
                return (region.sido && !region.sigungu) || (!region.sido && region.sigungu);
            });
            if (incompleteRegion) {
                return '관심 지역은 입력하려면 시/도와 시/군/구를 모두 선택해주세요.';
            }

            const keys = regions
                .filter(region => region.sido && region.sigungu)
                .map(region => `${region.sido} ${region.sigungu}`);
            if (new Set(keys).size !== keys.length) {
                return '입력한 관심 지역은 서로 다르게 선택해주세요.';
            }

            return '';
        }

        function setJobValues(data) {
            const major = document.getElementById('jobMajor');
            const mid = document.getElementById('jobMid');
            const minor = document.getElementById('jobMinor');
            const detail = document.getElementById('jobDetail');

            major.value = data.preferred_job_type_major || '';
            fillSelect(mid, Object.keys(KSCO[major.value] || {}), data.preferred_job_type_mid || '');
            fillSelect(minor, Object.keys(KSCO[major.value]?.[mid.value] || {}), data.preferred_job_type_minor || '');
            fillSelect(detail, Object.keys(KSCO[major.value]?.[mid.value]?.[minor.value] || {}), data.preferred_job_type_detail || '');
        }

        async function loadMemberInfo() {
            try {
                [1, 2, 3].forEach(setupRegionCascade);
                setupJobCascade();

                const response = await fetch('/auth/members/me', {
                    headers: authHeaders()
                });

                if (response.status === 401 || response.status === 403) {
                    alert('로그인이 필요합니다.');
                    location.href = '/auth/login';
                    return;
                }
                if (!response.ok) return;

                const data = await response.json();
                if (data.nickname) {
                    document.getElementById('nicknameInput').value = data.nickname;
                }
                setRegionValues(data);
                setJobValues(data);
                document.getElementById('preferredPayType').value = data.preferred_pay_type || '';
                document.getElementById('minPayAmount').value = data.min_pay_amount || '';
                document.getElementById('emailNotification').checked = data.email_notification || false;
            } catch (error) {
                console.error('회원 정보 조회 실패:', error);
            }
        }

        async function handleUpdate() {
            try {
                const nickname = document.getElementById('nicknameInput').value;
                const currentPassword = document.getElementById('currentPassword').value;
                const newPassword = document.getElementById('newPassword').value;
                const regions = [readRegion(1), readRegion(2), readRegion(3)];
                const regionError = validateRegions(regions);
                if (regionError) {
                    alert(regionError);
                    return;
                }
                const preferredJobTypeMajor = document.getElementById('jobMajor').value;
                const preferredJobTypeMid = document.getElementById('jobMid').value;
                const preferredJobTypeMinor = document.getElementById('jobMinor').value;
                const preferredJobTypeDetail = document.getElementById('jobDetail').value;
                const preferredPayType = document.getElementById('preferredPayType').value;
                const minPayAmount = document.getElementById('minPayAmount').value;

                // 값이 있는 필드만 객체에 담기
                const updateData = {};
                if (nickname) updateData.nickname = nickname;
                if (newPassword) {
                    updateData.currentPassword = currentPassword;
                    updateData.newPassword = newPassword;
                }
                updateData.desired_region_sido = regions[0].sido;
                updateData.desired_region_sigungu = regions[0].sigungu;
                updateData.desired_region_dong = '';
                const region1Detail = document.getElementById('region1Detail');
                if (region1Detail && region1Detail.value.trim()) {
                    const detailValue = region1Detail.value.trim();
                    // 주소가 확인되지 않았으면(또는 변경 후 미확인) 제출 차단
                    if (!addressVerified || verifiedAddress !== detailValue) {
                        const saveBtn = document.querySelector('.btn.btn-primary');
                        if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '주소 확인 중...'; }
                        try {
                            const geoRes = await fetch('/auth/geocode/preview', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ sido: regions[0].sido, sigungu: regions[0].sigungu, detail: detailValue })
                            });
                            if (!geoRes.ok) {
                                alert((await geoRes.text()) || '입력하신 주소의 위치를 찾을 수 없습니다. 상세 주소를 다시 확인해주세요.');
                                return;
                            }
                            addressVerified = true;
                            verifiedAddress = detailValue;
                        } catch (e) {
                            alert('주소 확인 중 오류가 발생했습니다.');
                            return;
                        } finally {
                            if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '저장하기'; }
                        }
                    }
                    updateData.home_address = detailValue;
                }
                updateData.desired_region2_sido = regions[1].sido;
                updateData.desired_region2_sigungu = regions[1].sigungu;
                updateData.desired_region3_sido = regions[2].sido;
                updateData.desired_region3_sigungu = regions[2].sigungu;
                updateData.preferred_job_type_major = preferredJobTypeMajor;
                updateData.preferred_job_type_mid = preferredJobTypeMid;
                updateData.preferred_job_type_minor = preferredJobTypeMinor;
                updateData.preferred_job_type_detail = preferredJobTypeDetail;
                updateData.preferred_pay_type = preferredPayType;
                if (minPayAmount) {
                    updateData.min_pay_amount = parseInt(minPayAmount, 10);
                } else {
                    updateData.min_pay_amount = 0;
                }
                updateData.email_notification = document.getElementById('emailNotification').checked;

                if (Object.keys(updateData).length === 0) {
                    alert('수정할 정보를 입력해주세요.');
                    return;
                }

                const response = await fetch('/auth/update/me', {
                    method: 'PATCH',
                    headers: authHeaders(),
                    body: JSON.stringify(updateData)
                });

                if (response.ok) {
                    alert('정보가 성공적으로 수정되었습니다.');
                    location.href = '/auth/mypage';
                } else {
                    const errorMsg = await response.text();
                    alert('수정 실패: ' + errorMsg);
                }
            } catch (error) {
                console.error('회원 정보 수정 실패:', error);
                alert('수정 중 오류가 발생했습니다.');
            }
        }
    </script>
</body>
</html>
