<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Recruit - 마이페이지</title>
  <style>
    :root{
      --bg:#f3f5f7; --card:#fff; --line:#d7dde4; --text:#1f2937; --muted:#667085;
      --primary:#1f6fb2; --primary-strong:#185f99; --danger:#b42318; --radius:12px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:720px;margin:40px auto;padding:0 16px}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px}
    h1{margin:0 0 16px;font-size:28px}
    h2{margin:0 0 10px;font-size:20px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .info{padding:12px;border:1px solid #e4e9f0;border-radius:10px;background:#fafbfc;margin-bottom:10px}
    .label{color:var(--muted);font-size:13px}
    .value{font-size:16px;font-weight:700}
    .region-list{display:grid;gap:8px;margin-top:8px}
    .region-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #dbe7f3;border-radius:10px;background:#fff}
    .region-rank{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:28px;border-radius:999px;background:#e8f2fb;color:var(--primary);font-size:13px;font-weight:800}
    .region-rank.optional{background:#f1f5f9;color:var(--muted)}
    .region-value{font-size:15px;font-weight:800;color:var(--text)}
    .form-field{display:grid;gap:6px;margin-top:12px}
    .form-field label{font-size:13px;font-weight:800;color:var(--muted)}
    .form-field input,.form-field select{height:42px;border:1px solid #cfd6df;border-radius:10px;padding:0 12px;font-size:15px;background:#fff;color:var(--text)}
    .status-text{margin:10px 0 0;font-size:13px;color:var(--muted)}
    .btn{height:42px;border:none;border-radius:10px;padding:0 14px;font-weight:800;cursor:pointer}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-strong)}
    .btn-ghost{background:#fff;color:var(--text);border:1px solid #cfd6df}
    .btn-danger{background:#fff;color:var(--danger);border:1px solid #efc6c2}

    /* ── 스크랩 공고 목록 ── */
    .scrap-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border: 1px solid #dbe7f3;
      border-radius: 10px;
      background: #fafbfc;
      transition: opacity .25s ease, border-color .25s ease;
    }
    .scrap-item.unscraped {
      opacity: 0.45;
      border-color: #e2e8f0;
    }
    .scrap-item__info { flex: 1; min-width: 0; }
    .scrap-item__company { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
    .scrap-item__title  { font-weight: 700; font-size: 15px; margin-bottom: 6px; word-break: break-all; }
    .scrap-item__meta   { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--muted); }
    .scrap-item__actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }

    .btn-detail {
      display: inline-block;
      padding: 6px 14px;
      background: var(--primary);
      color: #fff;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      border: none;
      cursor: pointer;
    }
    .btn-detail:hover { background: var(--primary-strong); }

    .btn-scrap {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
      border: 1px solid #f59e0b;
      background: #fffbef;
      color: #d97706;
    }
    .btn-scrap.is-unscraped {
      border-color: #ccd5df;
      background: #fff;
      color: #6b7280;
    }
    .btn-scrap:disabled { cursor: not-allowed; opacity: 0.6; }
  </style>
  <script src="/js/auth-utils.js"></script>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>내 계정 정보</h1>
      <p id="loadingText" style="margin:0 0 12px; color:#667085;">내 정보를 불러오는 중...</p>
      <p id="errorText" style="display:none; margin:0 0 12px; color:#b42318;"></p>

      <div id="profileBox" hidden>
        <div class="info"><div class="label">이메일</div><div class="value" id="displayEmail"></div></div>
        <div class="info"><div class="label">닉네임</div><div class="value" id="displayNickname"></div></div>
        <div class="info">
          <div class="label">관심 지역</div>
          <div class="region-list">
            <div class="region-item">
              <span class="region-rank">관심 1</span>
              <span class="region-value" id="displayRegion1"></span>
            </div>
            <div class="region-item">
              <span class="region-rank optional">관심 2</span>
              <span class="region-value" id="displayRegion2"></span>
            </div>
            <div class="region-item">
              <span class="region-rank optional">관심 3</span>
              <span class="region-value" id="displayRegion3"></span>
            </div>
          </div>
        </div>
        <div class="info"><div class="label">선호 직종</div><div class="value" id="displayJobType"></div></div>
        <div class="info"><div class="label">선호 급여 유형</div><div class="value" id="displayPayType"></div></div>
        <div class="info"><div class="label">최소 희망 급여</div><div class="value" id="displayMinPay"></div></div>
      </div>

      <div class="row" style="margin-top: 16px;">
        <button class="btn btn-primary" onclick="location.href='/auth/edit-profile'">정보 수정하기</button>
        <button class="btn btn-ghost" onclick="location.href='/jobpostings'">메인으로</button>
      </div>
    </section>

    <section class="card" id="scrapSection">
      <h2>스크랩한 공고</h2>
      <p id="scrapLoading" style="color:#667085; margin:0 0 8px;">스크랩 목록을 불러오는 중...</p>
      <p id="scrapEmpty" style="display:none; color:#667085; margin:0;">스크랩한 공고가 없습니다.</p>
      <div id="scrapList" style="display:grid; gap:10px;"></div>
    </section>

    <section class="card">
      <h2>AI 맞춤 추천</h2>
      <p style="color:#667085;margin:0;">Gemini API 키를 저장하면 관심 직종과 관심 지역 기준으로 공고별 추천 이유가 자동 생성됩니다.</p>
      <p style="color:#667085;font-size:13px;margin:6px 0 0;">
        키가 없으신가요?
        <button type="button" onclick="openGeminiModal()"
                style="background:none;border:none;padding:0;color:#4f46e5;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;">
          발급 방법 보기 →
        </button>
      </p>
      <div class="form-field">
        <label for="geminiApiKey">Gemini API 키</label>
        <input id="geminiApiKey" type="password" autocomplete="off" placeholder="Gemini API 키 입력" />
      </div>
      <div class="form-field">
        <label for="geminiCustomPrompt">추가 요청사항</label>
        <textarea id="geminiCustomPrompt" rows="3"
                  placeholder="복지 좋으면서 시급 높은 곳 위주로 추천해줘"
                  style="width:100%;resize:vertical;padding:8px 12px;border:1px solid #cfd6df;border-radius:8px;font-size:14px;color:#172033;"></textarea>
      </div>
      <div class="form-field">
        <label for="geminiInterval">갱신 주기</label>
        <select id="geminiInterval">
          <option value="">비활성</option>
          <option value="1">1시간</option>
          <option value="3">3시간</option>
          <option value="6">6시간</option>
          <option value="12">12시간</option>
          <option value="24">24시간</option>
        </select>
      </div>
      <div class="row" style="margin-top: 14px;">
        <button class="btn btn-primary" type="button" onclick="saveGeminiSettings()">AI 추천 설정 저장</button>
        <button class="btn btn-ghost" type="button" id="refreshRecommendationsBtn" onclick="refreshRecommendationsNow()">지금 갱신</button>
        <button class="btn btn-ghost" type="button" onclick="clearRecommendations()">추천 초기화</button>
      </div>
      <p id="geminiStatus" class="status-text"></p>
      <p id="refreshStatus" class="status-text"></p>
    </section>

    <section class="card">
      <h2>회원 탈퇴</h2>
      <p style="color:#667085">탈퇴 시 모든 데이터가 삭제되며 복구할 수 없습니다.</p>
      <button class="btn btn-danger" onclick="deleteAccount()">계정 삭제하기</button>
    </section>

    <!-- Gemini API 키 발급 안내 모달 -->
    <div id="geminiGuideModal"
         style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;padding:16px;">
      <div style="background:#fff;border-radius:14px;width:100%;max-width:min(860px, 92vw);max-height:90vh;overflow-y:auto;padding:32px 32px 28px;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.18);">
        <button type="button" onclick="closeGeminiModal()" style="position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#667085;">✕</button>
        <h3 style="margin:0 0 4px;font-size:17px;font-weight:700;color:#172033;">Gemini API 키 발급 방법</h3>
        <p id="geminiStepIndicator" style="margin:0 0 16px;font-size:13px;color:#4f46e5;font-weight:600;"></p>
        <img id="geminiStepImg" src="" alt="" style="width:100%;max-height:min(480px, 55vh);object-fit:contain;border-radius:8px;border:1px solid #e5e7eb;margin-bottom:14px;" />
        <p id="geminiStepTitle" style="margin:0 0 4px;font-size:15px;font-weight:700;color:#172033;"></p>
        <p id="geminiStepDesc" style="margin:0 0 20px;font-size:13px;color:#667085;"></p>
        <div style="display:flex;gap:10px;">
          <button type="button" id="geminiPrevBtn" onclick="" style="flex:1;min-height:40px;border-radius:8px;border:1px solid #cfd6df;background:#fff;color:#52606d;font-size:14px;font-weight:600;cursor:pointer;"></button>
          <button type="button" id="geminiNextBtn" onclick="" style="flex:1;min-height:40px;border-radius:8px;background:#4f46e5;color:#fff;font-size:14px;font-weight:600;border:none;cursor:pointer;"></button>
        </div>
      </div>
    </div>
  </main>

<script>
  // getToken() / authHeaders() / escapeHtml() → auth-utils.js 에서 전역 제공

  const GEMINI_GUIDE_STEPS = [
    { img:'/img/gemini-guide/step1.png', title:'로그인 후 "API 키 만들기" 클릭', desc:'Google 계정으로 로그인한 뒤, 빨간 표시된 "API 키 만들기" 버튼을 클릭하세요.' },
    { img:'/img/gemini-guide/step2.png', title:'프로젝트 이름 입력 후 키 생성', desc:'프로젝트 이름을 "smart recruit"로 입력하고 "키 생성" 버튼을 클릭하세요.' },
    { img:'/img/gemini-guide/step3.png', title:'생성된 키 복사 후 붙여넣기', desc:'빨간 표시된 복사 버튼을 클릭해 키를 복사한 뒤, 입력란에 붙여넣고 저장하세요.' }
  ];
  let geminiStep = 0;

  function renderGeminiStep() {
    const s = GEMINI_GUIDE_STEPS[geminiStep];
    document.getElementById('geminiStepIndicator').textContent = (geminiStep + 1) + ' / ' + GEMINI_GUIDE_STEPS.length + '단계';
    document.getElementById('geminiStepImg').src = s.img;
    document.getElementById('geminiStepImg').alt = s.title;
    document.getElementById('geminiStepTitle').textContent = s.title;
    document.getElementById('geminiStepDesc').textContent = s.desc;
    const prevBtn = document.getElementById('geminiPrevBtn');
    const nextBtn = document.getElementById('geminiNextBtn');

    if (geminiStep === 0) {
      prevBtn.textContent = '키 발급 바로가기 →';
      prevBtn.disabled = false;
      prevBtn.style.opacity = '1';
      prevBtn.onclick = () => window.open('https://aistudio.google.com/app/api-keys', '_blank');
    } else {
      prevBtn.textContent = '← 이전';
      prevBtn.disabled = false;
      prevBtn.style.opacity = '1';
      prevBtn.onclick = () => geminiCarousel(-1);
    }

    if (geminiStep === GEMINI_GUIDE_STEPS.length - 1) {
      nextBtn.textContent = '닫기';
      nextBtn.onclick = () => closeGeminiModal();
    } else {
      nextBtn.textContent = '다음 →';
      nextBtn.onclick = () => geminiCarousel(1);
    }
  }

  function geminiCarousel(dir) {
    geminiStep = Math.max(0, Math.min(GEMINI_GUIDE_STEPS.length - 1, geminiStep + dir));
    renderGeminiStep();
  }

  function openGeminiModal() {
    geminiStep = 0;
    renderGeminiStep();
    document.getElementById('geminiGuideModal').style.display = 'flex';
  }

  function closeGeminiModal() {
    geminiStep = 0;
    document.getElementById('geminiGuideModal').style.display = 'none';
  }

  document.getElementById('geminiGuideModal').addEventListener('click', function(e) {
    if (e.target === this) closeGeminiModal();
  });

  function setText(id, value) {
    const element = document.getElementById(id);
    if (element) {
      element.textContent = value || '미설정';
    }
  }

  function joinConfigured(values) {
    const parts = values.filter(value => value && value.trim());
    return parts.length ? parts.join(' · ') : '미설정';
  }

  async function loadMyInfo() {
    const token = getToken();
    const profileBox = document.getElementById('profileBox');
    const loadingText = document.getElementById('loadingText');
    const errorText = document.getElementById('errorText');

    if (!token || token === 'undefined' || token === 'null') {
      alert('로그인이 필요합니다.');
      localStorage.clear();
      location.href = '/auth/login';
      return;
    }

    loadingText.style.display = 'block';
    errorText.style.display = 'none';
    profileBox.hidden = true;

    try {
      const response = await fetch('/auth/members/me', {
        method: 'GET',
        headers: authHeaders()
      });

      if (response.ok) {
        const data = await response.json();

        setText('displayEmail', data.email);
        setText('displayNickname', data.nickname);
        setText('displayRegion1', joinConfigured([
          data.desired_region_sido,
          data.desired_region_sigungu
        ]));
        setText('displayRegion2', joinConfigured([
          data.desired_region2_sido,
          data.desired_region2_sigungu
        ]));
        setText('displayRegion3', joinConfigured([
          data.desired_region3_sido,
          data.desired_region3_sigungu
        ]));
        setText('displayJobType', joinConfigured([
          data.preferred_job_type_major,
          data.preferred_job_type_mid,
          data.preferred_job_type_minor,
          data.preferred_job_type_detail
        ]));
        setText('displayPayType', data.preferred_pay_type);

        const minPayEl = document.getElementById('displayMinPay');
        if (minPayEl) {
          minPayEl.textContent = data.min_pay_amount > 0
            ? data.min_pay_amount.toLocaleString() + '원'
            : '미설정';
        }

        const geminiApiKey = data.gemini_api_key ?? data.geminiApiKey ?? '';
        const recommendationInterval = data.recommendation_interval_hours ?? data.recommendationIntervalHours ?? '';
        const recommendationCustomPrompt = data.recommendation_custom_prompt ?? data.recommendationCustomPrompt ?? '';
        const geminiApiKeyInput = document.getElementById('geminiApiKey');
        const geminiCustomPromptTA = document.getElementById('geminiCustomPrompt');
        const geminiIntervalSelect = document.getElementById('geminiInterval');
        if (geminiApiKeyInput) geminiApiKeyInput.value = geminiApiKey || '';
        if (geminiCustomPromptTA) geminiCustomPromptTA.value = recommendationCustomPrompt || '';
        if (geminiIntervalSelect) geminiIntervalSelect.value = recommendationInterval ? String(recommendationInterval) : '';

        profileBox.hidden = false;
      } else if (response.status === 401 || response.status === 403) {
        alert('세션이 만료되었거나 유효하지 않습니다. 다시 로그인해주세요.');
        localStorage.clear();
        location.href = '/auth/login';
      } else {
        const msg = await response.text();
        errorText.textContent = msg || `내 정보를 불러오지 못했습니다. (HTTP ${response.status})`;
        errorText.style.display = 'block';
      }
    } catch (e) {
      console.error('정보 로드 실패:', e);
      errorText.textContent = '네트워크 오류가 발생했습니다.';
      errorText.style.display = 'block';
    } finally {
      loadingText.style.display = 'none';
    }
  }

  async function deleteAccount() {
    if (!confirm('정말로 탈퇴하시겠습니까? 모든 정보가 파기됩니다.')) return;

    try {
      const response = await fetch('/auth/delete/me', {
        method: 'DELETE',
        headers: authHeaders()
      });

      if (response.ok || response.status === 204) {
        alert('탈퇴 처리가 완료되었습니다. 이용해 주셔서 감사합니다.');
        localStorage.clear();
        window.location.href = '/jobpostings';
      } else if (response.status === 401 || response.status === 403) {
        alert('로그인이 필요합니다.');
        location.href = '/auth/login';
      } else {
        const errorMsg = await response.text();
        alert('탈퇴 실패: ' + (errorMsg || '권한이 없습니다.'));
      }
    } catch (error) {
      console.error('탈퇴 처리 실패:', error);
      alert('서버와의 통신 오류로 탈퇴에 실패했습니다.');
    }
  }

  // escapeHtml() → auth-utils.js 에서 전역 제공

  /* ── 스크랩 목록 렌더링 ─────────────────────────────────────── */
  async function loadScraps() {
    const token = getToken();
    if (!token || token === 'undefined' || token === 'null') return;

    const loadingEl = document.getElementById('scrapLoading');
    const emptyEl   = document.getElementById('scrapEmpty');
    const listEl    = document.getElementById('scrapList');

    try {
      const res = await fetch('/api/scraps/my', { headers: authHeaders() });

      if (res.status === 401) {
        alert('로그인이 만료되었습니다. 다시 로그인해 주세요.');
        localStorage.clear();
        location.href = '/auth/login';
        return;
      }
      if (!res.ok) { loadingEl.style.display = 'none'; return; }

      const items = await res.json();
      loadingEl.style.display = 'none';

      if (!items || items.length === 0) {
        emptyEl.style.display = 'block';
        return;
      }

      /* ── 스크랩 목록 렌더링 ─────────────────────────────────────── */
      listEl.innerHTML = items.map(item => {
        
        const postingId = item.job_posting_id; 
        const isClosed = item.status === 'CLOSED';
        const closedBadge = isClosed
          ? '<span style="display:inline-block;background:#fee2e2;color:#dc2626;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;margin-right:6px;vertical-align:middle;">마감</span>'
          : '';
        
        return `
          <div class="scrap-item" id="scrap-row-${postingId}" data-scraped="true" style="${isClosed ? 'opacity:0.6;' : ''}">
            <div class="scrap-item__info">
              <div class="scrap-item__company">${escapeHtml(item.company)}</div>
              <div class="scrap-item__title">${closedBadge}${escapeHtml(item.title)}</div>
              <div class="scrap-item__meta">
                <span>📍 ${escapeHtml(item.location)}</span>
                <span>💰 ${escapeHtml(item.salary)}</span>
                <span>📅 ${escapeHtml(item.deadline)}</span>
              </div>
            </div>
            <div class="scrap-item__actions">
              <a class="btn-detail" href="/jobpostings?focusId=${postingId}">자세히 보기</a>
              
              <button class="btn-scrap" type="button" data-id="${postingId}">★ 스크랩됨</button>
            </div>
          </div>
        `;
      }).join('');

    } catch (e) {
      console.error('스크랩 목록 로드 실패:', e);
      loadingEl.style.display = 'none';
    }
  }

  /* ── 초기화 및 이벤트 위임 묶기  ─────────────────── */
  window.addEventListener('DOMContentLoaded', () => {
    // 1. 데이터 먼저 불러오기
    loadMyInfo();
    loadScraps();

    // 2. DOM 생성이 완벽히 보장된 이 시점에 안전하게 이벤트 리스너 바인딩
    const scrapListEl = document.getElementById('scrapList');
    if (scrapListEl) {
      scrapListEl.addEventListener('click', async (e) => {
        const btn = e.target.closest('.btn-scrap');
        if (!btn) return;

        const token = getToken();
        if (!token || token === 'undefined' || token === 'null') {
          alert('로그인이 필요한 서비스입니다.');
          return;
        }

        const jobPostingId = btn.dataset.id;
        const row = btn.closest('.scrap-item');

        if (!jobPostingId) {
          console.error("공고 ID를 찾을 수 없습니다.");
          return;
        }

        // 중복 클릭 방지
        btn.disabled = true;

        try {
          const res = await fetch(`/api/scraps/toggle?jobPostingId=${jobPostingId}`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
          });

          if (res.status === 401) {
            alert('로그인이 만료되었습니다. 다시 로그인해 주세요.');
            localStorage.clear();
            location.href = '/auth/login';
            return;
          }
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const data = await res.json(); // { "scraped": true | false }

          if (data.scraped) {
            row.classList.remove('unscraped');
            row.dataset.scraped = 'true';
            btn.classList.remove('is-unscraped');
            btn.textContent = '★ 스크랩됨';
          } else {
            row.classList.add('unscraped');
            row.dataset.scraped = 'false';
            btn.classList.add('is-unscraped');
            btn.textContent = '☆ 스크랩';
          }

          // 활성 스크랩 0개면 안내 문구 표시
          const emptyEl = document.getElementById('scrapEmpty');
          if (emptyEl) {
            const activeCount = document.querySelectorAll('.scrap-item[data-scraped="true"]').length;
            emptyEl.style.display = activeCount === 0 ? 'block' : 'none';
          }

        } catch (e) {
          console.error('스크랩 토글 실패:', e);
          alert('스크랩 처리 중 오류가 발생했습니다.');
        } finally {
          btn.disabled = false;
        }
      });
    }
  });

  /* ── Gemini AI 추천 설정 ─────────────────────────────────────── */
  async function saveGeminiSettings() {
    const status = document.getElementById('geminiStatus');
    const apiKey = document.getElementById('geminiApiKey').value.trim();
    const intervalValue = document.getElementById('geminiInterval').value;

    if (status) {
      status.textContent = '저장 중...';
      status.style.color = '#667085';
    }

    try {
      const response = await fetch('/auth/me/gemini', {
        method: 'PATCH',
        headers: authHeaders(),
        body: JSON.stringify({
          gemini_api_key: apiKey,
          interval_hours: intervalValue ? Number(intervalValue) : null,
          custom_prompt: (document.getElementById('geminiCustomPrompt')?.value ?? '').trim()
        })
      });

      if (response.ok) {
        if (status) {
          status.textContent = 'AI 추천 설정이 저장되었습니다.';
          status.style.color = '#1f6fb2';
        }
      } else if (response.status === 401 || response.status === 403) {
        alert('로그인이 필요합니다.');
        location.href = '/auth/login';
      } else {
        const message = await response.text();
        if (status) {
          status.textContent = message || 'AI 추천 설정 저장에 실패했습니다.';
          status.style.color = '#b42318';
        }
      }
    } catch (error) {
      console.error('AI 추천 설정 저장 실패:', error);
      if (status) {
        status.textContent = '네트워크 오류가 발생했습니다.';
        status.style.color = '#b42318';
      }
    }
  }

  function estimatedTimeLabel(data) {
    const seconds = data?.estimated_seconds ?? data?.estimatedSeconds;
    if (seconds === null || seconds === undefined) {
      return '처음 갱신은 시간이 걸릴 수 있어요.';
    }
    return `약 ${Math.ceil(seconds)}초 예상`;
  }

  async function loadEstimatedRecommendationTime() {
    const response = await fetch('/api/job-postings/recommendations/estimated-time', {
      method: 'GET',
      headers: { 'Accept': 'application/json' }
    });
    if (!response.ok) {
      return '처음 갱신은 시간이 걸릴 수 있어요.';
    }
    return estimatedTimeLabel(await response.json());
  }

  async function refreshRecommendationsNow() {
    const status = document.getElementById('refreshStatus');
    const button = document.getElementById('refreshRecommendationsBtn');

    if (status) {
      status.textContent = '예상 대기시간 확인 중...';
      status.style.color = '#667085';
    }

    if (button) {
      button.disabled = true;
      button.textContent = '처리 중...';
    }

    try {
      const estimateText = await loadEstimatedRecommendationTime();
      if (status) {
        status.textContent = `${estimateText} · 처리 중...`;
        status.style.color = '#667085';
      }

      const response = await fetch('/api/job-postings/recommendations/refresh', {
        method: 'POST',
        headers: authHeaders()
      });

      if (response.ok) {
        const data = await response.json();
        const count = data.count ?? 0;
        const durationSeconds = data.duration_seconds ?? data.durationSeconds ?? 0;
        const message = data.message || '갱신 완료';
        const completedText = `${message} (${count}개 공고, ${Number(durationSeconds).toFixed(1)}초)`;
        if (status) {
          status.textContent = completedText;
          status.style.color = '#1f6fb2';
        }
        alert(completedText);
      } else if (response.status === 401 || response.status === 403) {
        alert('로그인이 필요합니다.');
        location.href = '/auth/login';
      } else {
        const message = await response.text();
        if (status) {
          status.textContent = message || '맞춤 추천 갱신에 실패했습니다.';
          status.style.color = '#b42318';
        }
      }
    } catch (error) {
      console.error('맞춤 추천 갱신 실패:', error);
      if (status) {
        status.textContent = '네트워크 오류가 발생했습니다.';
        status.style.color = '#b42318';
      }
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = '지금 갱신';
      }
    }
  }

  async function clearRecommendations() {
    if (!confirm('저장된 AI 추천 공고를 모두 삭제하시겠습니까?')) return;

    const status = document.getElementById('refreshStatus');
    try {
      const res = await fetch('/api/job-postings/recommendations', {
        method: 'DELETE',
        headers: authHeaders()
      });

      if (status) {
        status.textContent = res.ok ? '추천 공고가 초기화되었습니다.' : '초기화에 실패했습니다.';
        status.style.color = res.ok ? '#1f6fb2' : '#b42318';
      }
    } catch (error) {
      console.error('추천 초기화 실패:', error);
      if (status) {
        status.textContent = '초기화에 실패했습니다.';
        status.style.color = '#b42318';
      }
    }
  }

  // loadMyInfo()는 통합 DOMContentLoaded 핸들러에서 호출됨 (중복 제거)
</script>
