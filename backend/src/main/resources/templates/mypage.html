<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart Recruit - 마이페이지</title>
    <style>
        .container { width: 520px; margin: 50px auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        .info-box { background: #f9f9f9; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .btn-update { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 10px 15px; cursor: pointer; margin-top: 20px; border-radius: 4px; }
        .btn-home { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; margin-left: 10px; border-radius: 4px; }
        p { line-height: 1.5; }
    </style>
</head>
<body>
<div class="container">
    <h2>내 계정 정보</h2>
    <div class="info-box">
        <p><strong>이메일:</strong> <span id="displayEmail">로딩 중...</span></p>
        <p><strong>닉네임:</strong> <span id="displayNickname">로딩 중...</span></p>
        <p><strong>선호 지역:</strong> <span id="displayRegion">로딩 중...</span></p>
        <p><strong>선호 직종:</strong> <span id="displayJobType">로딩 중...</span></p>
        <p><strong>선호 급여 유형:</strong> <span id="displayPayType">로딩 중...</span></p>
        <p><strong>최소 희망 급여:</strong> <span id="displayMinPay">로딩 중...</span></p>
        <button class="btn-update" onclick="location.href='/auth/edit-profile'">정보 수정하기</button>
        <button class="btn-home" onclick="location.href='/main'">메인으로</button>
    </div>

    <hr>
    <h3>회원 탈퇴</h3>
    <p style="color: #666; font-size: 0.9em;">탈퇴 시 모든 데이터가 삭제되며 복구할 수 없습니다.</p>
    <button class="btn-delete" onclick="deleteAccount()">계정 삭제하기</button>
</div>

<script>
    function getToken() {
        const match = document.cookie.match(/(?:^|;\s*)accessToken=([^;]+)/);
        return match ? match[1] : (localStorage.getItem('accessToken') || '');
    }

    function authHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        const token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return headers;
    }

    function setText(id, value) {
        document.getElementById(id).textContent = value || '미설정';
    }

    function joinConfigured(values) {
        const parts = values.filter(value => value && value.trim());
        return parts.length ? parts.join(' · ') : '미설정';
    }

    window.onload = async function() {
        try {
            const response = await fetch('/auth/members/me', {
                method: 'GET',
                headers: authHeaders()
            });

            if (response.ok) {
                const data = await response.json();
                setText('displayEmail', data.email);
                setText('displayNickname', data.nickname);
                setText('displayRegion', joinConfigured([
                    data.desired_region_sido,
                    data.desired_region_sigungu,
                    data.desired_region_dong
                ]));
                setText('displayJobType', joinConfigured([
                    data.preferred_job_type_major,
                    data.preferred_job_type_mid,
                    data.preferred_job_type_minor,
                    data.preferred_job_type_detail
                ]));
                setText('displayPayType', data.preferred_pay_type);
                document.getElementById('displayMinPay').textContent =
                    data.min_pay_amount > 0 ? data.min_pay_amount.toLocaleString() + '원' : '미설정';
            } else if (response.status === 401 || response.status === 403) {
                alert('로그인이 필요합니다.');
                location.href = '/auth/login';
            }
        } catch (error) {
            console.error('정보 로드 실패:', error);
        }
    };

    async function deleteAccount() {
        if (!confirm('정말로 탈퇴하시겠습니까? 모든 정보가 삭제됩니다.')) return;

        const response = await fetch('/auth/delete/me', {
            method: 'DELETE',
            headers: authHeaders()
        });

        if (response.ok || response.status === 204) {
            alert('탈퇴 처리가 완료되었습니다. 이용해 주셔서 감사합니다.');
            localStorage.clear();
            window.location.href = '/main';
        } else if (response.status === 401 || response.status === 403) {
            alert('로그인이 필요합니다.');
            location.href = '/auth/login';
        } else {
            const errorMsg = await response.text();
            alert('탈퇴 실패: ' + (errorMsg || '권한이 없습니다.'));
        }
    }
</script>
</body>
</html>
