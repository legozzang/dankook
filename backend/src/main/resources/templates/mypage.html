<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Recruit - 마이페이지</title>
  <style>
    :root{
      --bg:#f3f5f7; --card:#fff; --line:#d7dde4; --text:#1f2937; --muted:#667085;
      --primary:#1f6fb2; --primary-strong:#185f99; --danger:#b42318; --radius:12px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:720px;margin:40px auto;padding:0 16px}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:16px}
    h1{margin:0 0 16px;font-size:28px}
    h2{margin:0 0 10px;font-size:20px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .info{padding:12px;border:1px solid #e4e9f0;border-radius:10px;background:#fafbfc;margin-bottom:10px}
    .label{color:var(--muted);font-size:13px}
    .value{font-size:16px;font-weight:700}
    .region-list{display:grid;gap:8px;margin-top:8px}
    .region-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #dbe7f3;border-radius:10px;background:#fff}
    .region-rank{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:28px;border-radius:999px;background:#e8f2fb;color:var(--primary);font-size:13px;font-weight:800}
    .region-rank.optional{background:#f1f5f9;color:var(--muted)}
    .region-value{font-size:15px;font-weight:800;color:var(--text)}
    .form-field{display:grid;gap:6px;margin-top:12px}
    .form-field label{font-size:13px;font-weight:800;color:var(--muted)}
    .form-field input,.form-field select{height:42px;border:1px solid #cfd6df;border-radius:10px;padding:0 12px;font-size:15px;background:#fff;color:var(--text)}
    .status-text{margin:10px 0 0;font-size:13px;color:var(--muted)}
    .btn{height:42px;border:none;border-radius:10px;padding:0 14px;font-weight:800;cursor:pointer}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-primary:hover{background:var(--primary-strong)}
    .btn-ghost{background:#fff;color:var(--text);border:1px solid #cfd6df}
    .btn-danger{background:#fff;color:var(--danger);border:1px solid #efc6c2}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>내 계정 정보</h1>
      <p id="loadingText" style="margin:0 0 12px; color:#667085;">내 정보를 불러오는 중...</p>
      <p id="errorText" style="display:none; margin:0 0 12px; color:#b42318;"></p>

      <div id="profileBox" hidden>
        <div class="info"><div class="label">이메일</div><div class="value" id="displayEmail"></div></div>
        <div class="info"><div class="label">닉네임</div><div class="value" id="displayNickname"></div></div>
        <div class="info">
          <div class="label">관심 지역</div>
          <div class="region-list">
            <div class="region-item">
              <span class="region-rank">관심 1</span>
              <span class="region-value" id="displayRegion1"></span>
            </div>
            <div class="region-item">
              <span class="region-rank optional">관심 2</span>
              <span class="region-value" id="displayRegion2"></span>
            </div>
            <div class="region-item">
              <span class="region-rank optional">관심 3</span>
              <span class="region-value" id="displayRegion3"></span>
            </div>
          </div>
        </div>
        <div class="info"><div class="label">선호 직종</div><div class="value" id="displayJobType"></div></div>
        <div class="info"><div class="label">선호 급여 유형</div><div class="value" id="displayPayType"></div></div>
        <div class="info"><div class="label">최소 희망 급여</div><div class="value" id="displayMinPay"></div></div>
      </div>

      <div class="row" style="margin-top: 16px;">
        <button class="btn btn-primary" onclick="location.href='/auth/edit-profile'">정보 수정하기</button>
        <button class="btn btn-ghost" onclick="location.href='/jobpostings'">메인으로</button>
      </div>
    </section>

    <section class="card">
      <h2>AI 맞춤 추천</h2>
      <p style="color:#667085;margin:0;">Gemini API 키를 저장하면 관심 직종과 관심 지역 기준으로 공고별 추천 이유가 자동 생성됩니다.</p>
      <div class="form-field">
        <label for="geminiApiKey">Gemini API 키</label>
        <input id="geminiApiKey" type="password" autocomplete="off" placeholder="Gemini API 키 입력" />
      </div>
      <div class="form-field">
        <label for="geminiInterval">갱신 주기</label>
        <select id="geminiInterval">
          <option value="">비활성</option>
          <option value="1">1시간</option>
          <option value="3">3시간</option>
          <option value="6">6시간</option>
          <option value="12">12시간</option>
          <option value="24">24시간</option>
        </select>
      </div>
      <div class="row" style="margin-top: 14px;">
        <button class="btn btn-primary" type="button" onclick="saveGeminiSettings()">AI 추천 설정 저장</button>
        <button class="btn btn-ghost" type="button" id="refreshRecommendationsBtn" onclick="refreshRecommendationsNow()">지금 갱신</button>
      </div>
      <p id="geminiStatus" class="status-text"></p>
      <p id="refreshStatus" class="status-text"></p>
    </section>

    <section class="card">
      <h2>회원 탈퇴</h2>
      <p style="color:#667085">탈퇴 시 모든 데이터가 삭제되며 복구할 수 없습니다.</p>
      <button class="btn btn-danger" onclick="deleteAccount()">계정 삭제하기</button>
    </section>
  </main>

<script>
  function getToken() {
    const match = document.cookie.match(/(?:^|;\s*)accessToken=([^;]+)/);
    return match ? match[1] : (localStorage.getItem('accessToken') || '');
  }

  function authHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    const token = getToken();
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return headers;
  }

  function setText(id, value) {
    const element = document.getElementById(id);
    if (element) {
      element.textContent = value || '미설정';
    }
  }

  function joinConfigured(values) {
    const parts = values.filter(value => value && value.trim());
    return parts.length ? parts.join(' · ') : '미설정';
  }

  async function loadMyInfo() {
    const token = getToken();
    const profileBox = document.getElementById('profileBox');
    const loadingText = document.getElementById('loadingText');
    const errorText = document.getElementById('errorText');

    if (!token || token === 'undefined' || token === 'null') {
      alert('로그인이 필요합니다.');
      localStorage.clear();
      location.href = '/auth/login';
      return;
    }

    loadingText.style.display = 'block';
    errorText.style.display = 'none';
    profileBox.hidden = true;

    try {
      const response = await fetch('/auth/members/me', {
        method: 'GET',
        headers: authHeaders()
      });

      if (response.ok) {
        const data = await response.json();

        setText('displayEmail', data.email);
        setText('displayNickname', data.nickname);
        setText('displayRegion1', joinConfigured([
          data.desired_region_sido,
          data.desired_region_sigungu
        ]));
        setText('displayRegion2', joinConfigured([
          data.desired_region2_sido,
          data.desired_region2_sigungu
        ]));
        setText('displayRegion3', joinConfigured([
          data.desired_region3_sido,
          data.desired_region3_sigungu
        ]));
        setText('displayJobType', joinConfigured([
          data.preferred_job_type_major,
          data.preferred_job_type_mid,
          data.preferred_job_type_minor,
          data.preferred_job_type_detail
        ]));
        setText('displayPayType', data.preferred_pay_type);

        const minPayEl = document.getElementById('displayMinPay');
        if (minPayEl) {
          minPayEl.textContent = data.min_pay_amount > 0
            ? data.min_pay_amount.toLocaleString() + '원'
            : '미설정';
        }

        const geminiApiKey = data.gemini_api_key ?? data.geminiApiKey ?? '';
        const recommendationInterval = data.recommendation_interval_hours ?? data.recommendationIntervalHours ?? '';
        const geminiApiKeyInput = document.getElementById('geminiApiKey');
        const geminiIntervalSelect = document.getElementById('geminiInterval');
        if (geminiApiKeyInput) geminiApiKeyInput.value = geminiApiKey || '';
        if (geminiIntervalSelect) geminiIntervalSelect.value = recommendationInterval ? String(recommendationInterval) : '';

        profileBox.hidden = false;
      } else if (response.status === 401 || response.status === 403) {
        alert('세션이 만료되었거나 유효하지 않습니다. 다시 로그인해주세요.');
        localStorage.clear();
        location.href = '/auth/login';
      } else {
        const msg = await response.text();
        errorText.textContent = msg || `내 정보를 불러오지 못했습니다. (HTTP ${response.status})`;
        errorText.style.display = 'block';
      }
    } catch (e) {
      console.error('정보 로드 실패:', e);
      errorText.textContent = '네트워크 오류가 발생했습니다.';
      errorText.style.display = 'block';
    } finally {
      loadingText.style.display = 'none';
    }
  }

  async function deleteAccount() {
    if (!confirm('정말로 탈퇴하시겠습니까? 모든 정보가 파기됩니다.')) return;

    try {
      const response = await fetch('/auth/delete/me', {
        method: 'DELETE',
        headers: authHeaders()
      });

      if (response.ok || response.status === 204) {
        alert('탈퇴 처리가 완료되었습니다. 이용해 주셔서 감사합니다.');
        localStorage.clear();
        window.location.href = '/jobpostings';
      } else if (response.status === 401 || response.status === 403) {
        alert('로그인이 필요합니다.');
        location.href = '/auth/login';
      } else {
        const errorMsg = await response.text();
        alert('탈퇴 실패: ' + (errorMsg || '권한이 없습니다.'));
      }
    } catch (error) {
      console.error('탈퇴 처리 실패:', error);
      alert('서버와의 통신 오류로 탈퇴에 실패했습니다.');
    }
  }

  async function saveGeminiSettings() {
    const status = document.getElementById('geminiStatus');
    const apiKey = document.getElementById('geminiApiKey').value.trim();
    const intervalValue = document.getElementById('geminiInterval').value;

    if (status) {
      status.textContent = '저장 중...';
      status.style.color = '#667085';
    }

    try {
      const response = await fetch('/auth/me/gemini', {
        method: 'PATCH',
        headers: authHeaders(),
        body: JSON.stringify({
          gemini_api_key: apiKey,
          interval_hours: intervalValue ? Number(intervalValue) : null
        })
      });

      if (response.ok) {
        if (status) {
          status.textContent = 'AI 추천 설정이 저장되었습니다.';
          status.style.color = '#1f6fb2';
        }
      } else if (response.status === 401 || response.status === 403) {
        alert('로그인이 필요합니다.');
        location.href = '/auth/login';
      } else {
        const message = await response.text();
        if (status) {
          status.textContent = message || 'AI 추천 설정 저장에 실패했습니다.';
          status.style.color = '#b42318';
        }
      }
    } catch (error) {
      console.error('AI 추천 설정 저장 실패:', error);
      if (status) {
        status.textContent = '네트워크 오류가 발생했습니다.';
        status.style.color = '#b42318';
      }
    }
  }

  function estimatedTimeLabel(data) {
    const seconds = data?.estimated_seconds ?? data?.estimatedSeconds;
    if (seconds === null || seconds === undefined) {
      return '처음 갱신은 시간이 걸릴 수 있어요.';
    }
    return `약 ${Math.ceil(seconds)}초 예상`;
  }

  async function loadEstimatedRecommendationTime() {
    const response = await fetch('/api/job-postings/recommendations/estimated-time', {
      method: 'GET',
      headers: { 'Accept': 'application/json' }
    });
    if (!response.ok) {
      return '처음 갱신은 시간이 걸릴 수 있어요.';
    }
    return estimatedTimeLabel(await response.json());
  }

  async function refreshRecommendationsNow() {
    const status = document.getElementById('refreshStatus');
    const button = document.getElementById('refreshRecommendationsBtn');

    if (status) {
      status.textContent = '예상 대기시간 확인 중...';
      status.style.color = '#667085';
    }

    if (button) {
      button.disabled = true;
      button.textContent = '처리 중...';
    }

    try {
      const estimateText = await loadEstimatedRecommendationTime();
      if (status) {
        status.textContent = `${estimateText} · 처리 중...`;
        status.style.color = '#667085';
      }

      const response = await fetch('/api/job-postings/recommendations/refresh', {
        method: 'POST',
        headers: authHeaders()
      });

      if (response.ok) {
        const data = await response.json();
        const count = data.count ?? 0;
        const durationSeconds = data.duration_seconds ?? data.durationSeconds ?? 0;
        const completedText = `갱신 완료 (${count}개 공고, ${Number(durationSeconds).toFixed(1)}초)`;
        if (status) {
          status.textContent = completedText;
          status.style.color = '#1f6fb2';
        }
        alert(completedText);
      } else if (response.status === 401 || response.status === 403) {
        alert('로그인이 필요합니다.');
        location.href = '/auth/login';
      } else {
        const message = await response.text();
        if (status) {
          status.textContent = message || '맞춤 추천 갱신에 실패했습니다.';
          status.style.color = '#b42318';
        }
      }
    } catch (error) {
      console.error('맞춤 추천 갱신 실패:', error);
      if (status) {
        status.textContent = '네트워크 오류가 발생했습니다.';
        status.style.color = '#b42318';
      }
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = '지금 갱신';
      }
    }
  }

  window.addEventListener('DOMContentLoaded', loadMyInfo);
</script>
</body>
</html>
